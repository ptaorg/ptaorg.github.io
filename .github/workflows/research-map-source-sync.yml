name: Sync nationwide map from authoritative index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-map-source-sync.yml'
      - 'scripts/research-map-layout.cjs'
      - 'data/research-map-index.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-map-source-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate map body without removing the primary survey
        run: |
          node scripts/refresh-national-map.mjs
          node scripts/refresh-national-map.mjs --check
          node --test tests/research-map-editorial.test.mjs
          git diff --check
      - name: Commit map HTML if source changes require it
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- research-map.html)" ]; then
            echo "Map HTML already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-map.html
          git commit -m "Sync nationwide map content with current evidence index"
          git pull --rebase origin main
          git push origin HEAD:main
