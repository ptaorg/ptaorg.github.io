name: One-time fix editorial panel headings
on:
  push:
    paths:
      - 'scripts/one-time-fix-editorial-panel-h2.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/one-time-fix-editorial-panel-h2.py
      - name: Verify
        run: |
          grep -q 'Editorial panels are article sections' css/prose.css
          grep -q '/css/prose.css?v=20260906-4' ppc-points.html
          npm run check:site
      - name: Commit cleanup
        run: |
          rm -f scripts/one-time-fix-editorial-panel-h2.py .github/workflows/one-time-fix-editorial-panel-h2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore editorial panel chapter heading styling' || exit 0
          git push
