name: One-time static global navigation migration

on:
  push:
    paths:
      - 'scripts/legacy/static-global-nav-migration.py'
      - 'css/global-nav.css'
      - '.github/workflows/one-time-static-global-nav.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate navigation into static HTML
        run: python3 scripts/legacy/static-global-nav-migration.py
      - name: Verify navigation migration
        run: |
          npm run check:site-js-version
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          count=0
          for p in Path('.').rglob('*.html'):
              if any(x in {'.git','node_modules','_site','assets','css','data','js','scripts','tools','ホーム'} for x in p.parts):
                  continue
              s=p.read_text(encoding='utf-8')
              if '<header class="site-header"' in s:
                  count += 1
                  if 'global-nav-v102' not in s or '/css/global-nav.css?v=20260906-1' not in s:
                      bad.append(str(p))
          site_js=Path('js/site.js').read_text(encoding='utf-8')
          if 'nav.innerHTML = desktopHtml' in site_js or 'mobileGroup(' in site_js:
              raise SystemExit('runtime nav generation still present')
          if bad:
              raise SystemExit('static nav missing: ' + ', '.join(bad[:20]))
          print('verified static headers:', count)
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Make global navigation static across site pages'
            git push
          fi
