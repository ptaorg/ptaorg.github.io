name: One-time static global navigation migration

on:
  push:
    paths:
      - 'scripts/legacy/static-global-nav-migration.py'
      - 'css/global-nav.css'
      - '.github/workflows/one-time-static-global-nav.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate navigation into static HTML
        run: python3 scripts/legacy/static-global-nav-migration.py
      - name: Run full site checks
        run: npm run check:all
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Make global navigation static across site pages'
            git push
          fi
