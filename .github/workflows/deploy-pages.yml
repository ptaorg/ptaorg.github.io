name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh generated search index
        run: node scripts/generate-search-index.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          expected=$(python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("support.html").read_text(encoding="utf-8")
          urls = sorted(set(re.findall(
              r'https://qr\.paypay\.ne\.jp/p2p01_[^"\'<>\s]+',
              source,
          )))
          if len(urls) != 1:
              raise SystemExit(
                  f"Expected exactly one unique PayPay URL in support.html; found {len(urls)}"
              )
          print(urls[0])
          PY
          )
          support_verified=false
          actual=''
          probe=''

          for attempt in $(seq 1 24); do
            probe="https://ptaorg.com/support.html?deployment=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)"
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$probe" --output /tmp/support-live.html; then
              actual=$(grep -o 'https://qr.paypay.ne.jp/p2p01_[^"< ]*' /tmp/support-live.html | head -n 1 || true)
              if grep --fixed-strings --quiet "$expected" /tmp/support-live.html; then
                support_verified=true
                break
              fi
            fi
            sleep 5
          done

          report_verified=false
          report_probe=''
          report_title='PTA運営の法的構造と是正基準'
          report_marker='data-page-revision="report-20260809-3"'
          report_heading='部分修正ではなく、内部事務の主体をそろえる'

          for attempt in $(seq 1 24); do
            report_probe="https://ptaorg.com/report.html?deployment=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)"
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$report_probe" --output /tmp/report-live.html; then
              if grep --fixed-strings --quiet "$report_title" /tmp/report-live.html \
                && grep --fixed-strings --quiet "$report_marker" /tmp/report-live.html \
                && grep --fixed-strings --quiet "$report_heading" /tmp/report-live.html; then
                report_verified=true
                break
              fi
            fi
            sleep 5
          done

          fetch_public() {
            local url="$1"
            local output="$2"
            local check_url=''
            for attempt in $(seq 1 24); do
              check_url="${url}?deployment=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)"
              if curl --fail --silent --show-error \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "$check_url" --output "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          mext_verified=false
          if fetch_public 'https://ptaorg.com/journal/mext-not-public.html' /tmp/mext-live.html \
            && grep --fixed-strings --quiet 'https://ptaorg.com/journal/mext-not-public.html' /tmp/mext-live.html \
            && grep --fixed-strings --quiet '文部科学省の公式通知・通達・文書回答そのものではありません' /tmp/mext-live.html; then
            mext_verified=true
          fi

          duty_journal_verified=false
          if fetch_public 'https://ptaorg.com/journal/pta-duty-concentration.html' /tmp/duty-journal-live.html \
            && grep --fixed-strings --quiet 'https://ptaorg.com/journal/pta-shokumu-sennen-gimu.html' /tmp/duty-journal-live.html \
            && grep --fixed-strings --quiet 'content="0;url=/journal/pta-shokumu-sennen-gimu.html"' /tmp/duty-journal-live.html; then
            duty_journal_verified=true
          fi

          duty_root_verified=false
          if fetch_public 'https://ptaorg.com/pta-duty-concentration.html' /tmp/duty-root-live.html \
            && grep --fixed-strings --quiet 'https://ptaorg.com/journal/pta-shokumu-sennen-gimu.html' /tmp/duty-root-live.html \
            && grep --fixed-strings --quiet 'content="0;url=/journal/pta-shokumu-sennen-gimu.html"' /tmp/duty-root-live.html; then
            duty_root_verified=true
          fi

          fee_redirect_verified=false
          if fetch_public 'https://ptaorg.com/journal/school-fee-illegality.html' /tmp/fee-redirect-live.html \
            && grep --fixed-strings --quiet 'https://ptaorg.com/journal/pta-fee-collection-legal-analysis.html' /tmp/fee-redirect-live.html \
            && grep --fixed-strings --quiet 'content="0;url=/journal/pta-fee-collection-legal-analysis.html"' /tmp/fee-redirect-live.html; then
            fee_redirect_verified=true
          fi

          sitemap_migration_verified=false
          if fetch_public 'https://ptaorg.com/sitemap-research.xml' /tmp/sitemap-research-live.xml \
            && grep --fixed-strings --quiet 'https://ptaorg.com/journal/mext-not-public.html' /tmp/sitemap-research-live.xml; then
            sitemap_migration_verified=true
          fi

          search_index_verified=false
          if fetch_public 'https://ptaorg.com/data/site-search-index.js' /tmp/site-search-live.js \
            && grep --fixed-strings --quiet '/journal/mext-not-public.html' /tmp/site-search-live.js; then
            search_index_verified=true
          fi

          migration_verified=false
          if [[ "$mext_verified" == 'true' \
            && "$duty_journal_verified" == 'true' \
            && "$duty_root_verified" == 'true' \
            && "$fee_redirect_verified" == 'true' \
            && "$sitemap_migration_verified" == 'true' \
            && "$search_index_verified" == 'true' ]]; then
            migration_verified=true
          fi

          echo "Migration checks: mext=$mext_verified duty_journal=$duty_journal_verified duty_root=$duty_root_verified fee=$fee_redirect_verified sitemap=$sitemap_migration_verified search_index=$search_index_verified"

          deployment_verified=false
          if [[ "$support_verified" == 'true' && "$report_verified" == 'true' && "$migration_verified" == 'true' ]]; then
            deployment_verified=true
          fi

          EXPECTED_URL="$expected" \
          ACTUAL_URL="$actual" \
          SUPPORT_VERIFIED="$support_verified" \
          SUPPORT_PROBE_URL="$probe" \
          REPORT_VERIFIED="$report_verified" \
          REPORT_PROBE_URL="$report_probe" \
          MEXT_VERIFIED="$mext_verified" \
          DUTY_JOURNAL_VERIFIED="$duty_journal_verified" \
          DUTY_ROOT_VERIFIED="$duty_root_verified" \
          FEE_REDIRECT_VERIFIED="$fee_redirect_verified" \
          SITEMAP_MIGRATION_VERIFIED="$sitemap_migration_verified" \
          SEARCH_INDEX_VERIFIED="$search_index_verified" \
          MIGRATION_VERIFIED="$migration_verified" \
          VERIFIED="$deployment_verified" \
          COMMIT_SHA="$GITHUB_SHA" \
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          record = {
              "commit": os.environ["COMMIT_SHA"],
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "support_page": "https://ptaorg.com/support.html",
              "support_probe_url": os.environ["SUPPORT_PROBE_URL"],
              "expected_paypay_url": os.environ["EXPECTED_URL"],
              "detected_paypay_url": os.environ["ACTUAL_URL"],
              "support_verified": os.environ["SUPPORT_VERIFIED"] == "true",
              "report_page": "https://ptaorg.com/report.html",
              "report_probe_url": os.environ["REPORT_PROBE_URL"],
              "report_revision": "report-20260809-3",
              "report_verified": os.environ["REPORT_VERIFIED"] == "true",
              "migration_pages": {
                  "mext_record_verified": os.environ["MEXT_VERIFIED"] == "true",
                  "duty_journal_redirect_verified": os.environ["DUTY_JOURNAL_VERIFIED"] == "true",
                  "duty_root_redirect_verified": os.environ["DUTY_ROOT_VERIFIED"] == "true",
                  "fee_redirect_verified": os.environ["FEE_REDIRECT_VERIFIED"] == "true",
                  "research_sitemap_verified": os.environ["SITEMAP_MIGRATION_VERIFIED"] == "true",
                  "site_search_index_verified": os.environ["SEARCH_INDEX_VERIFIED"] == "true",
                  "verified": os.environ["MIGRATION_VERIFIED"] == "true",
              },
              "verified": os.environ["VERIFIED"] == "true",
          }
          with open("/tmp/deployment-verification.json", "w", encoding="utf-8") as f:
              json.dump(record, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          echo "verified=$deployment_verified" >> "$GITHUB_OUTPUT"

      - name: Record verification result
        if: always() && steps.verify.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          git fetch origin deploy-status:refs/remotes/origin/deploy-status || true

          if git show-ref --verify --quiet refs/remotes/origin/deploy-status; then
            git switch --force-create deploy-status refs/remotes/origin/deploy-status
          else
            git switch --orphan deploy-status
          fi

          git rm --recursive --force . >/dev/null 2>&1 || true
          cp /tmp/deployment-verification.json deployment-verification.json
          git add deployment-verification.json
          git commit --message "Record Pages deployment verification for ${GITHUB_SHA}"
          git push --force origin deploy-status

      - name: Require successful public verification
        if: steps.verify.outputs.verified != 'true'
        run: |
          echo 'The deployed public pages did not pass all required verification checks.' >&2
          exit 1
