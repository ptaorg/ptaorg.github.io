name: one-time-journal-card-cache-bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[journal-card-cache]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump journal CSS version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('journal.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('/css/pages/journal.css?v=20260817-1','/css/pages/journal.css?v=20260821-2')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "ptaorg"
          git config user.email "az001530051919@gmail.com"
          git add journal.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[journal-card-cache] 論考一覧CSSを更新"
          git push
