name: Quick generated catalog check

on:
  pull_request:
    paths:
      - "sitemap.xml"
      - "data/site-search-index.js"
      - "scripts/generate-sitemap.js"
      - "scripts/generate-search-index.js"
      - "scripts/check-generated-files.js"
  push:
    branches:
      - fix/archive-catalog-order-20261026

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - name: Show generated sitemap diff on failure
        if: failure()
        run: |
          npm run generate:schools
          npm run generate:archive
          npm run enhance:pages
          npm run generate:sitemap
          git --no-pager diff -- sitemap.xml | head -120
