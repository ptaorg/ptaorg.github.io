name: URL and canonical verification
on:
  pull_request:
    paths:
      - "sitemap.xml"
      - "sitemap-research.xml"
      - "robots.txt"
      - "tests/migration.test.mjs"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/migration.test.mjs
