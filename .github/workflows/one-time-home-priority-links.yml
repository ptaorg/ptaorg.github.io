name: One-time home priority links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-home-priority-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add priority links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<section class="home-priority-nav" aria-label="重要ページ">'
          anchor = '</div></div></section>\n<section class="hc-section hc-core" aria-labelledby="hc-core-title">'
          block = '''</div></div></section>
<section class="home-priority-nav" aria-label="重要ページ"><div class="home-wrap"><nav class="home-priority-links" aria-label="重要ページへのショートカット">
<a class="home-priority-link home-priority-link--accent" href="/pta-school-processing.html"><span class="home-priority-kicker">全国比較</span><strong>学校によるPTA事務を検証</strong><small>15自治体・都道府県の法的整合性</small></a>
<a class="home-priority-link home-priority-link--accent" href="/submit-to-board.html"><span class="home-priority-kicker">実務</span><strong>教育委員会へ提出する</strong><small>提出資料・照会事項・進め方</small></a>
<a class="home-priority-link" href="/board-responses.html"><span class="home-priority-kicker">公式回答</span><strong>教育委員会の回答</strong><small>全国の自治体回答を確認</small></a>
<a class="home-priority-link" href="/national-archive.html"><span class="home-priority-kicker">一次資料</span><strong>全国資料館</strong><small>公文書・通知・実物資料</small></a>
<a class="home-priority-link" href="/pta-membership-optin.html"><span class="home-priority-kicker">加入</span><strong>任意加入・オプトイン</strong><small>加入意思と会員成立の基本</small></a>
<a class="home-priority-link" href="/ppc-points.html"><span class="home-priority-kicker">個人情報</span><strong>PPC資料を読む</strong><small>学校とPTA・61条・69条</small></a>
<a class="home-priority-link" href="/law-map.html"><span class="home-priority-kicker">法制度</span><strong>法制度マップ</strong><small>論点と関係法令を一覧化</small></a>
<a class="home-priority-link" href="/fee-collection.html"><span class="home-priority-kicker">会費</span><strong>学校徴収とPTA会費</strong><small>学校徴収金との境界を確認</small></a>
</nav></div></section>
<section class="hc-section hc-core" aria-labelledby="hc-core-title">'''
          if marker not in html:
              if anchor not in html:
                  raise SystemExit('home insertion anchor not found')
              html = html.replace(anchor, block, 1)
          html = html.replace('/css/home-entrance.css?v=20260903-1', '/css/home-entrance.css?v=20260905-2')
          html = html.replace('data-page-revision="home-boundary-20260903-1"', 'data-page-revision="home-priority-links-20260905-1"')
          index.write_text(html, encoding='utf-8')

          css_path = Path('css/home-entrance.css')
          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* Home priority shortcut cards. */'
          css_block = r'''

/* Home priority shortcut cards. */
@layer page {
  .home-priority-nav {
    padding: 18px 0 22px;
    border-bottom: 1px solid #dbe3e9;
    background: #fff;
  }

  .home-priority-links {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .home-priority-link {
    position: relative;
    display: grid;
    min-width: 0;
    min-height: 92px;
    gap: 4px;
    align-content: center;
    padding: 15px 42px 15px 17px;
    border: 1px solid #d5dee6;
    border-top: 3px solid #c8d2da;
    background: #fff;
    color: #15324d;
    text-decoration: none;
    box-shadow: 0 3px 10px rgba(15, 42, 67, 0.07);
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }

  .home-priority-link--accent {
    border-top-color: #d0a51b;
  }

  .home-priority-link::after {
    content: "→";
    position: absolute;
    top: 50%;
    right: 16px;
    color: #a37500;
    font-size: 1.05rem;
    font-weight: 900;
    transform: translateY(-50%);
  }

  .home-priority-link:hover,
  .home-priority-link:focus-visible {
    border-color: #c9a12a;
    box-shadow: 0 7px 18px rgba(15, 42, 67, 0.12);
    transform: translateY(-2px);
  }

  .home-priority-kicker {
    color: #8a6500;
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.08em;
  }

  .home-priority-link strong {
    overflow-wrap: anywhere;
    color: #102f4b;
    font-size: 0.98rem;
    line-height: 1.42;
  }

  .home-priority-link small {
    color: #657586;
    font-size: 0.74rem;
    line-height: 1.45;
  }

  @media (max-width: 980px) {
    .home-priority-links {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .home-priority-nav {
      padding: 12px 0 14px;
    }

    .home-priority-links {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .home-priority-link {
      min-height: 76px;
      padding: 11px 30px 11px 12px;
    }

    .home-priority-link::after {
      right: 10px;
      font-size: 0.9rem;
    }

    .home-priority-link strong {
      font-size: 0.87rem;
    }

    .home-priority-link small {
      display: none;
    }
  }
}
'''
          if css_marker not in css:
              css = css.rstrip() + css_block + '\n'
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'home-priority-nav' index.html
          grep -q '/pta-school-processing.html' index.html
          grep -q '/css/home-entrance.css?v=20260905-2' index.html
          grep -q 'Home priority shortcut cards' css/home-entrance.css
          npm run check:site
      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/one-time-home-priority-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/home-entrance.css
          git add -u
          git commit -m 'Add important page shortcuts to home' || exit 0
          git push
