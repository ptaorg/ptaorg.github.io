name: One-time global footer normalization

on:
  push:
    paths:
      - 'css/global-footer.css'
      - 'scripts/legacy/one-time-global-footer-normalize.py'
      - '.github/workflows/one-time-global-footer-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared footer stylesheet to public pages
        run: python3 scripts/legacy/one-time-global-footer-normalize.py
      - name: Verify footer stylesheet coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          skip={'.git','.claude','_site','node_modules','assets','css','data','js','scripts','tools','ホーム'}
          total=0
          missing=[]
          for p in Path('.').rglob('*.html'):
              if any(part in skip for part in p.parts):
                  continue
              s=p.read_text(encoding='utf-8')
              if not re.search(r'<footer\b',s,re.I):
                  continue
              total += 1
              if '/css/global-footer.css?v=20260906-1' not in s:
                  missing.append(str(p))
          if missing:
              raise SystemExit('missing global footer css: '+', '.join(missing[:30]))
          print('verified footer pages:', total)
          PY
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Apply shared footer styling across public pages'
            git push
          fi
