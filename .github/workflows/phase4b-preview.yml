name: Phase 4B page CSS QA (temporary)
on:
  push:
    branches: [refactor/phase4b-page-css-20261113]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize article page CSS and repair legacy design tokens
        run: node scripts/phase4b-page-styles.cjs
      - name: Test and preserve original styles and sources
        run: |
          npm test
          node scripts/phase4b-page-styles.cjs --check
          node tools/phase4b-verify.mjs
          git diff --check
      - name: Chrome regression (wide / narrow viewports)
        run: node tools/phase4b-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4b-screenshots
          path: phase4b-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit verified CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/site.css css/editorial.css css/pages/ css/reading-diagrams.css css/optin.css css/home.css css/home-entrance.css
          if ! git diff --cached --quiet; then
            git commit -m "Normalize high-use page styles and repair legacy token aliases"
            git push origin HEAD:refactor/phase4b-page-css-20261113
          fi
