name: one-time-nonmember-ch6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nonmember-ch6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite chapter 6
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('journal/nonmember-info.html')
          t = p.read_text(encoding='utf-8')
          new = '''        <h2>第6章　配布物・記念品の区分——その前に、学校はなぜ「非会員」を知っているのか</h2>
        <p>配布物や記念品の取扱いを論じる前に、先に確認しなければならない問題がある。<strong>そもそも学校は、どの保護者がPTA会員で、どの保護者が非会員なのかを、当然に把握できる立場にはない。</strong></p>
        <p>PTAへの加入・非加入は、学校への入学手続とは別の、PTAという任意団体への加入意思表示の結果である。したがって、「この児童生徒の保護者はPTA非会員である」という情報は、学校が児童生徒を教育するために当然に保有している情報ではない。</p>
        <p>学校が非会員を特定できているのであれば、その前段には必ず何らかの情報処理が存在する。たとえば、PTAから会員・非会員情報の提供を受ける、学校がPTAの入会申込書や会員名簿を確認する、学校保有の児童生徒名簿とPTA会員名簿を照合する、PTA会費の徴収・未徴収状況から加入・非加入を判別するといった処理である。</p>
        <p>したがって、学校内で「PTA会員の子」「非会員の子」を区別する運用が確認された場合、問題はその区別の妥当性だけでは終わらない。<strong>その区別を可能にした非会員情報を、学校がいつ、誰から、どのような目的で取得し、どの事務のために保有・利用しているのか</strong>を先に確認する必要がある。</p>
        <p>PTA内部で会員を管理することと、学校がその情報を保有・利用することは別問題である。学校側で恒常的に会員・非会員情報を取り扱うのであれば、学校が遂行する具体的な事務・業務との関係、その必要性、利用目的、PTAから情報提供を受ける場合の根拠などが説明されなければならない。単に「記念品を配り分けるため」「PTAから頼まれたため」という事情だけで、学校による非会員情報の把握が当然に正当化されるわけではない。</p>
        <p>そのうえで問題となるのが、子どもの扱いの区分である。卒業記念品を非会員の子どもには渡さない、会員家庭の子どもだけに行事案内を配る、登校班や学校内の活動で非会員家庭を区別する——こうした運用は、保護者の加入・非加入という<strong>大人の契約上の選択を、学校生活における子どもの取扱いへ転写する</strong>ものである。</p>
        <p>とりわけ教室内での配布では、実際に「渡す子」と「渡さない子」を選別するのが教職員となる場合がある。その時点で学校は、単にPTAの活動場所を提供しているのではなく、<strong>非会員情報を利用して児童生徒を仕分ける処理そのものに関与している</strong>ことになる。</p>
        <p>したがって、この問題を検証するときは、<strong>①なぜ学校が非会員を特定できるのか → ②その情報を学校が保有・利用できる根拠は何か → ③その情報を使って子どもの取扱いを区別してよいのか</strong>、という順序で見る必要がある。</p>
        <p>当会の照会に対しても、複数の教育委員会が、PTAへの加入・非加入によって児童生徒に不利益な取扱いが生じないようにすべきとの整理を示している。配布物や記念品の問題は、単なる「公平感」の問題ではない。<strong>その背後には、学校が本来知る必要のないPTAの会員・非会員情報を、どのように取得し、学校内で利用しているのかという個人情報処理の問題が存在する。</strong></p>

'''
          pattern = r'        <h2>第6章.*?</p>\n\n(?=        <h2>第7章)'
          t2, n = re.subn(pattern, new, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'chapter6 replacement failed: {n}')
          t2 = t2.replace('dateModified": "2026-07-19"', 'dateModified": "2026-08-21"')
          t2 = t2.replace('content="2026-07-19"', 'content="2026-08-21"')
          t2 = t2.replace('data-reviewed="2026-07-19"', 'data-reviewed="2026-08-21"')
          p.write_text(t2, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "ptaorg"
          git config user.email "az001530051919@gmail.com"
          git add journal/nonmember-info.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[nonmember-ch6] 第6章を非会員特定の前提から再構成"
          git push
