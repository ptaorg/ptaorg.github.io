name: Phase 3 shared UI verification (temporary)
on:
  push:
    branches: [refactor/phase3-shared-ui-20261113]
permissions:
  contents: write
jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize static chrome, search panels and article navigation
        run: |
          node scripts/render-chrome.mjs
          node scripts/phase3-sync-shared.cjs
      - name: Validate content and generated HTML
        run: |
          npm test
          node scripts/render-home-digest.mjs --check
          git diff --check
      - name: Verify generated changes against unmodified 2026-11-13 baseline
        run: node tools/phase3-verify-generated.mjs
      - name: Chromium desktop/mobile visual assertions
        run: node tools/phase3-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-screenshots
          path: phase3-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit verified generated HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate shared navigation and article UI without changing research prose"
            git push origin HEAD:refactor/phase3-shared-ui-20261113
          fi
