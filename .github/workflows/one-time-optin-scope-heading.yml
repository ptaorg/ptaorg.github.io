name: One-time optin scope heading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-optin-scope-heading.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Style scope heading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('css/optin.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* scope heading filled panel */'
          if marker not in css:
              css += '''\n\n  /* scope heading filled panel */\n  #scope > h2 {\n    display: block;\n    width: 100%;\n    margin: 0 0 24px;\n    padding: 16px 20px 18px;\n    border: 1px solid #17345c;\n    border-left: 6px solid var(--op-gold);\n    border-radius: 2px;\n    background: var(--op-navy);\n    color: #fff;\n    box-shadow: 0 8px 20px rgba(10, 25, 47, 0.10);\n  }\n\n  @media (max-width: 640px) {\n    #scope > h2 {\n      padding: 14px 15px 16px;\n      border-left-width: 4px;\n    }\n  }\n'''
              p.write_text(css, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q '#scope > h2' css/optin.css
          grep -q 'background: var(--op-navy)' css/optin.css
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/one-time-optin-scope-heading.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/optin.css
          git add -u
          git commit -m 'Style opt-in scope heading as filled white-text panel' || exit 0
          git push
