name: Phase 6A citation markup repair (temporary)
on:
  push:
    branches: [fix/phase6-citation-overlap-20261113]
permissions:
  contents: write
jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild every source-annotated HTML from the exact pre-phase6 original
        run: |
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const {TARGETS,citations}=require('./scripts/phase6-link-sources.cjs');
          const baseline='da107bc6d4149f9edfb93f8dc28ecb04734a1e41';
          let updated=0;
          for(const file of TARGETS){
            const original=execFileSync('git',['show',baseline+':'+file],{encoding:'utf8',maxBuffer:36*1024*1024});
            const generated=citations(original,file).html;
            const current=fs.readFileSync(file,'utf8');
            if(generated!==current){fs.writeFileSync(file,generated);updated++}
          }
          console.log('Rebuilt '+updated+' articles directly from preserved source documents');
          NODE
      - name: Run exact original-text and note-count validation
        run: |
          npm test
          node scripts/phase6-link-sources.cjs --check
          node tools/phase6-source-verify.mjs
          git diff --check
      - name: Inspect fixed citation markup in Chrome 1440px and 390px
        run: node tools/phase6-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-fixed-screenshots
          path: phase6-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit verified fixed article HTML only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Repair nested footnote markup with byte-exact article reconstruction"
            git push origin HEAD:fix/phase6-citation-overlap-20261113
          fi
