name: one-time-article35-display-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[article35-display]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('journal/pta-shokumu-sennen-gimu.html')
          t = p.read_text(encoding='utf-8')
          css = '<link href="/css/shared/current-location-nav-v5.css?v=2" rel="stylesheet"/>'
          js = '<script src="/js/current-location-nav.js?v=20260821-7" defer></script>'
          if css not in t:
              t = t.replace('</head>', css + '\n</head>', 1)
          if js not in t:
              t = t.replace('</body>', js + '\n</body>', 1)
          for old in [
              '/assets/images/article35/jichisho-1964-scan-20260821.png?v=2',
              '/assets/images/article35/jichisho-1964-scan-20260821.png',
              '/assets/images/article35/jichisho-1964-full.png'
          ]:
              t = t.replace(old, 'https://dl.ndl.go.jp/api/iiif/1341078/R0000099/full/full/0/default.jpg')
          t = t.replace('昭和39年1月20日自治給第14号の照会・回答を1枚で読めるようにしたスクリーンショット。熊本県教育委員会の照会3項目と自治省給与課長の回答を直接確認できます。', '国立国会図書館デジタルコレクションの原典画像。熊本県教育委員会の照会3項目と自治省給与課長の回答を見開きで直接確認できます。')
          t = t.replace('/css/pages/journal-pta-shokumu-sennen-gimu.css?v=20260821-2', '/css/pages/journal-pta-shokumu-sennen-gimu.css?v=20260821-3')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "ptaorg"
          git config user.email "az001530051919@gmail.com"
          git add journal/pta-shokumu-sennen-gimu.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[article35-display] 旧自治省原典画像と左固定現在地ナビを修正"
          git push
