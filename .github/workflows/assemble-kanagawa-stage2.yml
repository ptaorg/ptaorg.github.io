name: Assemble Kanagawa Stage2 package

on:
  push:
    branches:
      - stage2-package-20260717

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archives
        shell: bash
        run: |
          set -euo pipefail
          target='data/research/kanagawa-stage2/packages'
          mkdir -p "$target"
          cat .stage2-build/batch04.part*.b64 | base64 --decode > "$target/kanagawa_stage2_batch04_sato_review_pack_v2_1_20260707.zip"
          echo '393888c6d1d4ab23af43e7e627792cb70aadaf8b621995cf9d978d25af30e2d6  data/research/kanagawa-stage2/packages/kanagawa_stage2_batch04_sato_review_pack_v2_1_20260707.zip' | sha256sum --check
          echo '10cbfbc7445cc3040525aedccd0d4cbb7e3831f460a9f6aaab17f64f5c84b6f7  data/research/kanagawa-stage2/packages/kanagawa_stage2_batch06_outputs_v2_1_20260707_timeboxed.zip' | sha256sum --check
          unzip -t "$target/kanagawa_stage2_batch04_sato_review_pack_v2_1_20260707.zip"
          unzip -t "$target/kanagawa_stage2_batch06_outputs_v2_1_20260707_timeboxed.zip"

      - name: Replace temporary build files with verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .stage2-build
          rm -f .github/workflows/assemble-kanagawa-stage2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Kanagawa Stage2 packages'
          git push origin HEAD:stage2-package-20260717
