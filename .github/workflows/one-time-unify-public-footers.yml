name: One-time unify public footers

on:
  push:
    paths:
      - 'scripts/one-time-unify-public-footers.py'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer normalization
        run: python scripts/one-time-unify-public-footers.py
      - name: Verify site
        run: npm run check:site
      - name: Commit result
        run: |
          rm -f scripts/one-time-unify-public-footers.py
          rm -f .github/workflows/one-time-unify-public-footers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize footer styling across public pages' || exit 0
          git push
