      - name: Run repository checks
        run: npm test

      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser-check three revised pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editorial-open-audit
          python3 -m http.server 4173 >/tmp/editorial-open-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const pages = ['personnel.html', 'facilities.html', 'fee-collection.html'];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failed = false;

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport, locale: 'ja-JP', colorScheme: 'light' });
            for (const file of pages) {
              const page = await context.newPage();
              const response = await page.goto(`http://127.0.0.1:4173/${file}`, { waitUntil: 'networkidle', timeout: 30000 });
              const metrics = await page.evaluate(() => {
                const visible = (el) => {
                  const s = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0;
                };
                const selectors = '.editorial-brief,.editorial-panel,.scope-ok,.scope-ng,.safe-box,.wall,.triple-card,.trans-card,.req-step,.alert,.alert-block,.law-quote,.law-quote-block,.mext-quote,.source-lens-item,.faq-item';
                const cardLike = [...document.querySelectorAll(selectors)].filter(visible).map((el) => {
                  const s = getComputedStyle(el);
                  return {
                    className: String(el.className),
                    radius: parseFloat(s.borderTopLeftRadius) || 0,
                    shadow: s.boxShadow,
                  };
                });
                const main = document.querySelector('.pg-main,.pg,.issue-content');
                return {
                  title: document.title,
                  statusWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  h1Count: [...document.querySelectorAll('h1')].filter(visible).length,
                  mainWidth: main ? Math.round(main.getBoundingClientRect().width) : 0,
                  roundedCardCount: cardLike.filter((x) => x.radius > 4).length,
                  shadowCardCount: cardLike.filter((x) => x.shadow !== 'none').length,
                };
              });
              const problems = [];
              if (!response || response.status() >= 400) problems.push(`HTTP ${response ? response.status() : 'none'}`);
              if (metrics.scrollWidth > metrics.statusWidth + 2) problems.push(`horizontal overflow ${metrics.scrollWidth}>${metrics.statusWidth}`);
              if (metrics.h1Count !== 1) problems.push(`h1 count ${metrics.h1Count}`);
              if (viewport.name === 'desktop' && metrics.mainWidth < 850) problems.push(`main too narrow ${metrics.mainWidth}`);
              if (metrics.roundedCardCount) problems.push(`rounded cards ${metrics.roundedCardCount}`);
              if (metrics.shadowCardCount) problems.push(`shadow cards ${metrics.shadowCardCount}`);
              if (problems.length) failed = true;
              const shot = `editorial-open-audit/${viewport.name}__${file.replace('.html','')}.png`;
              await page.screenshot({ path: shot, fullPage: true });
              results.push({ file, viewport: viewport.name, ...metrics, problems, screenshot: shot });
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('editorial-open-audit/results.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (failed) process.exit(1);
          NODE

