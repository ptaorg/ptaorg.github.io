name: One-time rebuild global navigation

on:
  push:
    paths:
      - 'scripts/one-time-rebuild-global-nav.py'
      - 'scripts/one-time-rebuild-global-nav-v2.py'
      - '.github/workflows/one-time-rebuild-global-nav.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation rebuild
        run: python3 scripts/one-time-rebuild-global-nav-v2.py
      - name: Verify site
        run: |
          npm run check:site
          npm run check:site-js-version
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/site.js package.json SITE_STRUCTURE.md scripts/generate-school-pages.js '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Rebuild global navigation around core user journeys'
            git push
          fi
