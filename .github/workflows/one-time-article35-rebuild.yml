name: One-time article35 static rebuild

on:
  push:
    branches:
      - chatgpt/rebuild-article35-shiga-jichisho-20260821
    paths:
      - .github/workflows/one-time-article35-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Rebuild static article body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('journal/pta-shokumu-sennen-gimu.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '旧自治省の昭和39年行政実例は、「一般に」PTA・同窓会など任意団体の事務は35条の職務に含まれないと整理しました。他方、2026年滋賀県監査は、この行政実例を一般原則としつつ、特定のPTA会費一体徴収について「地方公共団体の事務と同一視し得るような特段の事情」と公的指揮監督を認定し、35条違反を否定しました。つまり、<strong>一般原則と個別例外の両方を見なければ、現在の法的整理として不十分</strong>です。',
              '旧自治省の昭和39年行政実例は、「一般に」PTA・同窓会など任意団体の事務は35条の職務に含まれないと整理しました。これが本ページの出発点です。2026年滋賀県監査はこれと異なる方向の判断を示しましたが、<strong>それ自体が検証対象であり、一般的な法理としてそのまま採用するものではありません</strong>。本ページでは、旧自治省の一般原則をまず確認した上で、滋賀県監査委員の論理にどこまで妥当性があるかを検討します。',
              'summary'
          )
          replace_once(
              '2026年 滋賀県監査—「特段の事情」という例外判定',
              '2026年 滋賀県監査—監査委員の独自判断をどう読むか',
              'toc'
          )

          old_sec = re.search(r'<section id="jichisho1964">.*?</section>', s, re.S)
          if not old_sec:
              raise SystemExit('missing jichisho section')
          new_sec = '''<section id="jichisho1964">
<p class="article35-label">3 / 旧自治省行政実例</p>
<h2>1964年1月20日 自治給第14号—熊本県教育委員会の照会と自治省の回答</h2>
<p>ここは要旨ではなく、<strong>照会と回答を一組で読む</strong>必要があります。熊本県教育委員会教育長は、県立学校におけるPTA・同窓会等の外郭団体業務が、地方公務員法35条の「当該地方公共団体がなすべき責を有する職務」に含まれるかを照会しました。</p>
<div class="article35-transcript" aria-label="昭和39年1月20日自治給第14号の照会と回答">
<div class="article35-transcript-block">
<p class="article35-transcript-label">照会</p>
<p>地方公務員法第35条に反した場合、または同義務免除の承認を受けても他から報酬を受ける場合は給与減額をしなければならないということを伺いましたが、同条にいう「当該地方公共団体がなすべき責を有する職務」の中に、県立学校におけるPTA、同窓会等の外郭団体の業務は含まれるかどうか伺います。この場合において、</p>
<ol><li>若し含まれるとした場合、団体費業務専任者が残勤した場合に、超過勤務手当の支給ができるか。</li><li>団体費から手当が若干支給されている場合はどうか。</li><li>団体費雇用職員があって、他の県事務の補助に従事している場合はどうか。</li></ol>
</div>
<div class="article35-transcript-block article35-transcript-answer">
<p class="article35-transcript-label">回答</p>
<p>具体的事情が明らかではないが、一般にPTA、同窓会など任意団体の事務は地方公務員法第35条に規定する「地方公共団体がなすべき責を有する職務」には含まれないと解されるので、地方公共団体の職員が正規の勤務時間外に、当該任意団体の事務に従事しても、これに対し時間外勤務手当を支給することはできない。また、地方公共団体の職員でない限り、給与は支給できない。</p>
</div>
</div>
<p>この行政実例の中核は、<strong>「一般にPTA、同窓会など任意団体の事務」は35条の職務に含まれない</strong>という点です。冒頭に「具体的事情が明らかではないが」という留保があるため、個別事情の検討余地がないとまではいえませんが、任意団体の内部事務を当然に公務として扱う発想とは明確に距離を置く行政実例です。</p>
<figure class="article35-figure">
<img alt="昭和39年1月20日自治給第14号の照会と回答のスクリーンショット" loading="lazy" src="/assets/images/article35/jichisho-1964-full.png"/>
<figcaption>昭和39年1月20日自治給第14号の照会・回答を一枚で確認できるように再掲したスクリーンショット。熊本県教育委員会の照会3項目と自治省給与課長の回答を直接確認できます。</figcaption>
</figure>
<figure class="article35-pdf-preview">
<iframe loading="lazy" title="昭和39年1月20日自治給第14号の照会と回答（資料まとめPDF 2ページ目）" src="/pta/docs/pta_work_and_duty.pdf#page=2&amp;view=FitH"></iframe>
<figcaption>資料まとめPDFの2ページ目。画像が見づらい環境では下のPDFリンクから開いてください。</figcaption>
</figure>
<div class="article35-source-row">
<p class="article35-source"><span>PDF</span><a href="/pta/docs/pta_work_and_duty.pdf#page=2" target="_blank">照会・回答をPDFで開く（P2）</a></p>
<p class="article35-source"><span>原典書誌</span><a href="https://ndlsearch.ndl.go.jp/books/R100000039-I1341078" rel="noopener" target="_blank">国立国会図書館サーチ</a></p>
<p class="article35-source"><span>デジタル資料</span><a href="https://dl.ndl.go.jp/pid/1341078/1/99" rel="noopener" target="_blank">国立国会図書館デジタルコレクション 該当頁</a></p>
</div>
</section>'''
          s = s[:old_sec.start()] + new_sec + s[old_sec.end():]

          shiga = re.search(r'<section class="article35-important" id="shiga2026">.*?</section>', s, re.S)
          if not shiga:
              raise SystemExit('missing shiga section')
          shiga_new = '''<section class="article35-important" id="shiga2026">
<p class="article35-label">7 / 2026年の監査結果をどう読むか</p>
<h2>滋賀県監査委員の「特段の事情」論は、そのまま採用せず批判的に読む</h2>
<p>2026年6月2日公表の滋賀県住民監査請求結果は、県立高校で授業料等とPTA会費等を一体的に徴収する契約を対象に、地方公務員法35条違反を検討しました。監査結果は昭和39年旧自治省行政実例を引用し、PTA会費の本来的徴収権者はPTAであり、PTA会費徴収は本来的には私的団体の事務であることを認めています。</p>
<p>しかし監査委員はその後、東京高裁平成19年10月4日判決を手掛かりに、<strong>「地方公共団体の事務と同一視し得るような特段の事情」と公的指揮監督</strong>があれば35条に反しないという判断枠組みを示し、対象事案では違反を否定しました。</p>
<div class="article35-counterpoint">
<strong>本ページの評価</strong>
<p>この監査結果を、PTA会費徴収についての一般的な35条解釈としてそのまま採用することはできません。監査結果が参照する東京高裁判決は土地区画整理組合への職員派遣をめぐる事案で、PTA会費徴収とは制度的前提が大きく異なります。したがって、同判決の射程をPTA会費徴収へ一般化できるか自体が検討事項です。</p>
<p>また、滋賀県監査は、<strong>授業料等との一体徴収という県自身が構築した運用を「一体性」を基礎付ける事情として重視している点</strong>にも注意が必要です。一体化した運用の存在を、その運用を公務と評価する根拠に用いるのであれば、運用が職務性を自己正当化する循環になっていないかを検証しなければなりません。</p>
<p>したがって、ここから直ちに「PTA会費徴収も特段の事情があれば公務になる」と一般化することはできません。滋賀県監査を援用する側には、参照判例との共通性、法令上・制度上の根拠、実際の指揮監督、一体処理自体の適法性を具体的に説明する必要があります。</p>
</div>
<p>この意味で滋賀県監査は、こちらが従うべき基準というより、<strong>反対論として想定し、その論証の妥当性を検証すべき資料</strong>です。旧自治省行政実例の一般原則を当然に修正するものとして読むのではなく、個別監査における一つの判断として位置付けます。</p>
<p class="article35-source"><span>滋賀県 公式PDF</span><a href="https://www.pref.shiga.lg.jp/file/attachment/5614558.pdf#page=17" rel="noopener" target="_blank">令和8年6月2日 滋賀県公報 住民監査請求結果（該当部分 P17〜P20）</a></p>
</section>'''
          s = s[:shiga.start()] + shiga_new + s[shiga.end():]

          replace_once(
              '一体徴収等の特段事情、委任、指揮監督、会員・債権の確認',
              'まず会員・債権の成立を確認し、その上で学校側が職務だというなら法令上・制度上の根拠を示せるか',
              'task table'
          )
          replace_once(
              '2020年文科省通知は、標準職務例にない職務でも、学校・地域の実情に応じて事務職員が担うことが必要と校長が認める職務を、一定の前提の下で校務分掌に位置付け得るとしています。また、2026年滋賀県監査も、内規で校務と位置付けていることだけで直ちに違法・不当とはならないと判断しました。',
              '2020年文科省通知は、標準職務例にない職務でも、学校・地域の実情に応じて事務職員が担うことが必要と校長が認める職務を、一定の前提の下で校務分掌に位置付け得るとしています。ここから言えるのは、校務分掌が無意味ではないということまでです。',
              'assignment p1'
          )
          replace_once(
              'しかし、だからといって、任意団体から頼まれたあらゆる事務を校務分掌に記載すれば35条の問題が消えるわけでもありません。滋賀県監査自身が、私的団体から事務委任を受ければ無制限に許されるわけではないとして、<strong>地方公共団体の事務と同一視できる特段事情と公的指揮監督</strong>を要求しました。校務分掌は重要な事実の一つですが、それだけで結論を先取りしないことが必要です。',
              'しかし、だからといって、任意団体から頼まれたあらゆる事務を校務分掌に記載すれば35条の問題が消えるわけではありません。PTA会則や内規の記載は、地方公共団体の職務性を自動的に作り出しません。校務分掌は重要な事実の一つにとどまり、<strong>その前提として本当に地方公共団体の事務といえるのか</strong>を別途説明する必要があります。',
              'assignment p2'
          )
          replace_once(
              '直ちに断定はできません。まず具体的作業を特定し、学校・地方公共団体の職務としての位置付け、校務分掌、委任、指揮監督等を確認します。一般に任意団体の事務は職務に含まれないとする旧自治省行政実例がある一方、2026年滋賀県監査は、特段事情と公的指揮監督を認定した特定のPTA会費徴収について35条違反を否定しました。',
              '直ちに断定は避けるべきですが、出発点は明確です。一般に任意団体の事務は35条の職務に含まれないとする旧自治省行政実例があり、PTA会計は本来その側に位置します。学校・地方公共団体の職務だというなら、その法令上・制度上の根拠を個別に示す必要があります。滋賀県監査は反対材料ではありますが、その論理自体が検証対象です。',
              'faq'
          )
          replace_once(
              '旧自治省行政実例を再掲しつつ、「特段の事情」と公的指揮監督を認定したPTA会費一体徴収について35条違反を否定した、現在の検討で必ず確認すべき資料。',
              'PTA会費一体徴収をめぐって監査委員が独自の「特段の事情」論を採用した資料。結論を追認するのではなく、その論証のどこまでが一般化できるのかを確認するための反対材料として読む必要があります。',
              'resource shiga'
          )

          path.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git add -- journal/pta-shokumu-sennen-gimu.html
          if git diff --cached --quiet; then
            echo 'No article changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '滋賀県監査の位置付けと旧自治省資料を再構成'
          git push origin HEAD:${{ github.ref_name }}
