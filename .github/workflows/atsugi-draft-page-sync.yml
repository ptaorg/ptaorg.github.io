name: Atsugi 15 verified-school HTML draft sync
on:
  push:
    branches:
      - work/atsugi-36-school-review-20261116
    paths:
      - scripts/generate-atsugi-reviewed-pages.cjs
      - .github/workflows/atsugi-draft-page-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atsugi-draft-page-sync
  cancel-in-progress: false

jobs:
  regenerate-reviewed-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate only 15 source-reviewed school pages
        run: node scripts/generate-atsugi-reviewed-pages.cjs
      - name: Ensure only specified Atsugi pages changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No HTML updates required'
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              archive/atsugi/*/index.html) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          count="$(printf '%s\n' "$changed" | grep -c .)"
          test "$count" -le 15
          git diff --stat
      - name: Commit generated pages only to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git add archive/atsugi/*/index.html
          if git diff --cached --quiet; then
            echo 'No files to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'draft(atsugi): render 15 reviewed school pages from source JSON'
          git push origin HEAD:work/atsugi-36-school-review-20261116
      - name: Validate static site (draft only; no deployment)
        run: npm test
