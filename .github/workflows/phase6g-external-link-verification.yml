name: Phase 6G external-link verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/phase6g-external-link-verification.yml'
permissions:
  contents: read
jobs:
  http-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit all public external links
        run: node tools/phase6b-audit-external.mjs
      - name: Create reproducible updated artifact and print status inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='reports', baseline='phase6b-external-link-status-20261113';
          const data=JSON.parse(fs.readFileSync(dir+'/'+baseline+'.json','utf8'));
          const date=new Date().toISOString().slice(0,10);
          data.checked_on=date;
          data.audit_revision='phase6g';
          data.method='Site-wide HTTP reachability, not confirmation of source identity';
          const out='phase6g-external-link-status-'+date;
          fs.writeFileSync(dir+'/'+out+'.json',JSON.stringify(data,null,2)+'\n');
          const md=fs.readFileSync(dir+'/'+baseline+'.md','utf8')
            .replaceAll('フェーズ6B','フェーズ6G')
            .replaceAll('phase6b-external-link-status-20261113.json',out+'.json')
            .replaceAll('確認日：2026年11月13日（GitHub Actions）','確認日：'+date+'（GitHub Actions）');
          fs.writeFileSync(dir+'/'+out+'.md',md);
          console.log('PHASE6G_REPORT_FILES='+JSON.stringify([out+'.md',out+'.json']));
          console.log('PHASE6G_SUMMARY='+JSON.stringify({checked_on:date,pages:data.html_pages,urls:data.unique_urls,by_kind:data.by_kind}));
          for(const item of data.results.filter(x=>x.kind!=='ok')){
            console.log('PHASE6G_UNVERIFIED='+JSON.stringify({url:item.url,kind:item.kind,status:item.status,used_on:item.used_on,final:item.final,error:item.error||''}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6g-external-link-results
          path: |
            reports/phase6g-external-link-status-*.md
            reports/phase6g-external-link-status-*.json
          if-no-files-found: warn
          retention-days: 30
