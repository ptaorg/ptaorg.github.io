name: Temporary navigation visual check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nav-check
          cd /tmp/nav-check
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install chromium --with-deps

      - name: Run local site and inspect navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/nav-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          sleep 2
          cat > /tmp/nav-check/check.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const desktop = await browser.newContext({ viewport: { width: 1280, height: 1000 } });
          const page = await desktop.newPage();
          const urls = ['index.html', 'ppc-points.html', 'pta-membership-optin.html', 'journal.html', 'national-archive.html'];
          const report = { desktop: {}, mobile: {} };

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          for (const file of urls) {
            await page.goto(`http://127.0.0.1:4173/${file}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(400);
            const nav = page.locator('.desktop-nav');
            assert(await nav.isVisible(), `${file}: desktop nav not visible`);
            const labels = await page.locator('.desktop-nav > .nav-link, .desktop-nav > .nav-item > .nav-link').allTextContents();
            const normalized = labels.map((text) => text.replace(/\s+/g, '').replace('▾', ''));
            assert(JSON.stringify(normalized) === JSON.stringify(['トップ', 'PPC資料', 'オプトイン', '立場別', '論考', '全国資料館']), `${file}: unexpected desktop labels ${JSON.stringify(normalized)}`);

            const logoBox = await page.locator('.logo').boundingBox();
            const navBox = await nav.boundingBox();
            const containerBox = await page.locator('.nav-container').boundingBox();
            const search = page.locator('.header-search');
            const searchBox = await search.count() ? await search.boundingBox() : null;
            assert(logoBox && navBox && containerBox, `${file}: missing required header geometry`);
            if (searchBox) {
              assert(searchBox.x + searchBox.width <= navBox.x + 1, `${file}: search overlaps navigation`);
            } else {
              assert(logoBox.x + logoBox.width <= navBox.x + 1, `${file}: logo overlaps navigation`);
            }
            assert(navBox.x + navBox.width <= containerBox.x + containerBox.width + 1, `${file}: navigation exceeds container`);
            assert(navBox.height < 80, `${file}: navigation wrapped vertically`);

            const audience = page.locator('.desktop-nav .nav-item.has-dropdown');
            await audience.hover();
            const menu = audience.locator('.mega-menu');
            assert(await menu.isVisible(), `${file}: audience dropdown not visible`);
            const audienceLinks = (await menu.locator('a').allTextContents()).map((text) => text.trim());
            assert(audienceLinks.length === 4, `${file}: audience dropdown count ${audienceLinks.length}`);
            report.desktop[file] = { labels: normalized, audienceLinks, logoBox, searchBox, navBox, containerBox };
          }
          await page.goto('http://127.0.0.1:4173/ppc-points.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(400);
          await page.screenshot({ path: '/tmp/navigation-desktop.png', fullPage: false });
          await desktop.close();

          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const mobilePage = await mobile.newPage();
          await mobilePage.goto('http://127.0.0.1:4173/ppc-points.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await mobilePage.waitForTimeout(400);
          assert(!(await mobilePage.locator('.desktop-nav').isVisible()), 'mobile: desktop nav should be hidden');
          const hamburger = mobilePage.locator('#hamburger');
          assert(await hamburger.isVisible(), 'mobile: hamburger not visible');
          await hamburger.click();
          const overlay = mobilePage.locator('#mobileOverlay');
          await overlay.waitFor({ state: 'visible', timeout: 5000 });
          const mobileLabels = (await overlay.locator('a.mobile-link').allTextContents()).map((text) => text.trim());
          for (const label of ['トップ', 'PPC資料の読み方', 'オプトイン', '論考', '全国資料館', '保護者の方へ', 'PTA役員の方へ', '教育委員会・学校へ', '研究者・記者の方へ']) {
            assert(mobileLabels.includes(label), `mobile: missing ${label}`);
          }
          await mobilePage.screenshot({ path: '/tmp/navigation-mobile.png', fullPage: false });
          report.mobile.labels = mobileLabels;
          fs.writeFileSync('/tmp/navigation-browser-report.json', JSON.stringify(report, null, 2) + '\n');
          await mobile.close();
          await browser.close();
          console.log(JSON.stringify(report, null, 2));
          JS
          cd /tmp/nav-check
          set +e
          node check.mjs > /tmp/navigation-browser-log.txt 2>&1
          status=$?
          set -e
          cat /tmp/navigation-browser-log.txt
          exit "$status"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-visual-check
          path: |
            /tmp/navigation-browser-report.json
            /tmp/navigation-browser-log.txt
            /tmp/navigation-desktop.png
            /tmp/navigation-mobile.png
            /tmp/nav-http.log
          if-no-files-found: warn
          retention-days: 3
