name: Phase 4C maintained CSS verification (temporary)
on:
  push:
    branches: [refactor/phase4c-editorial-css-20261113]
permissions:
  contents: write
jobs:
  qa-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize maintained CSS and refresh asset query versions
        run: |
          node scripts/phase4c-normalize-maintained.cjs
          node scripts/phase4-update-cache.cjs
      - name: Check tests, asset preservation and HTML-only version changes
        run: |
          npm test
          node scripts/phase4c-normalize-maintained.cjs --check
          node scripts/phase4-update-cache.cjs --check
          node tools/phase4c-verify.mjs
          node tools/phase4c-verify-html.mjs
          git diff --check
      - name: Inspect desktop and smartphone pages
        run: node tools/phase4c-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4c-editorial-screenshots
          path: phase4c-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit verified generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/ '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Align maintained editorial CSS with semantic palette and refresh style queries"
            git push origin HEAD:refactor/phase4c-editorial-css-20261113
          fi
