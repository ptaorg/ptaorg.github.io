name: Temporary Setagaya fast site check
on:
  push:
    branches: [article/setagaya-pta-information-separation-20261010]
permissions:
  contents: read
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run and report full npm test quickly
        shell: bash
        run: |
          set +e
          npm test > /tmp/setagaya-test.log 2>&1
          status=$?
          cat /tmp/setagaya-test.log
          echo "npm_test_exit_status=${status}"
          exit 0
