name: One-time fix board response H2

on:
  push:
    paths:
      - 'scripts/one-time-fix-board-response-h2.py'
      - '.github/workflows/one-time-fix-board-response-h2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply H2 fix
        run: python3 scripts/one-time-fix-board-response-h2.py
      - name: Verify site
        run: npm run check:site
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/pages/board-responses.css board-responses.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Align board response chapter headings with site style'
            git push
          fi
