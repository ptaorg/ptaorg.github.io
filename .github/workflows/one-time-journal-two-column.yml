name: One-time journal two-column cards

on:
  push:
    paths:
      - 'scripts/one-time-journal-two-column.py'
      - '.github/workflows/one-time-journal-two-column.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply journal layout
        run: python3 scripts/one-time-journal-two-column.py
      - name: Verify journal styles
        run: |
          grep -q 'two-column journal cards' css/pages/journal.css
          grep -q 'journal.css?v=20260906-1' journal.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/pages/journal.css journal.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Make journal cards two-column with stronger color borders'
            git push
          fi
