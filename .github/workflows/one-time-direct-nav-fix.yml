name: one-time-direct-nav-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[direct-nav]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML directly
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              'guide-parent.html',
              'membership.html',
              'privacy.html',
              'fee-collection.html',
          ]
          css = '<link rel="stylesheet" href="/css/shared/current-location-nav.css?v=20260821-3">'
          js = '<script src="/js/current-location-nav.js?v=20260821-3" defer></script>'
          for name in pages:
              p = Path(name)
              t = p.read_text(encoding='utf-8')
              if css not in t:
                  t = t.replace('</head>', css + '\n</head>', 1)
              if js not in t:
                  t = t.replace('</body>', js + '\n</body>', 1)
              p.write_text(t, encoding='utf-8')

          article = Path('journal/pta-shokumu-sennen-gimu.html')
          t = article.read_text(encoding='utf-8')
          t = t.replace('/assets/images/article35/jichisho-1964-full.png', '/assets/images/article35/jichisho-1964-scan-20260821.png')
          article.write_text(t, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "ptaorg"
          git config user.email "az001530051919@gmail.com"
          git add guide-parent.html membership.html privacy.html fee-collection.html journal/pta-shokumu-sennen-gimu.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[direct-nav] 現在地ナビをHTMLから直接読込し旧自治省画像URLを更新"
          git push
