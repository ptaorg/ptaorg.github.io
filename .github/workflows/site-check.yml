name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-guide-board-news-full-20260717
          fetch-depth: 0

      - name: Diagnose and attempt guide-board revision
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          text = Path('guide-board.html').read_text(encoding='utf-8')
          diagnostic = {
            'bytes': len(text.encode('utf-8')),
            'style_marker_count': text.count('guide-board-principal-evidence-20260717'),
            'principal_id_count': text.count('id="principal-liability"'),
            'principal_single_quote_id_count': text.count("id='principal-liability'"),
            'head_close_count': text.count('</head>'),
            'main_exact_count': text.count('<main>'),
            'main_newline_count': text.count('<main>\n'),
            'executive_anchor_count': text.count('<section id="board-executive-brief"'),
          }
          Path('guide-board-revision-diagnostic.json').write_text(json.dumps(diagnostic, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(diagnostic, ensure_ascii=False, indent=2))
          PY
          set +e
          python3 scripts/fix-guide-board-news-full.py > guide-board-revision.log 2>&1
          STATUS=$?
          set -e
          cat guide-board-revision.log
          echo "$STATUS" > guide-board-revision-status.txt
          exit "$STATUS"

      - name: Upload revision diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-board-revision-diagnostics
          path: |
            guide-board-revision-diagnostic.json
            guide-board-revision.log
            guide-board-revision-status.txt

      - name: Stop when revision failed
        shell: bash
        run: |
          STATUS=$(cat guide-board-revision-status.txt)
          if [ "$STATUS" != "0" ]; then
            echo "Guide-board revision failed with status $STATUS"
            exit "$STATUS"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies if package metadata is present
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Run site checks
        run: npm test
