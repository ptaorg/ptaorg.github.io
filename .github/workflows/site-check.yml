name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked dependencies if present
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json; repository checks use the checked-in scripts directly."
          fi

      - name: Run site checks
        run: npm test

      - name: Ensure checks leave checkout clean
        run: git diff --exit-code
