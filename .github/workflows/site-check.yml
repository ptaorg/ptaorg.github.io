name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render correct PPC PNG files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet PyMuPDF
          curl --fail --location --retry 3 --output /tmp/ppc.pdf \
            https://www.ppc.go.jp/files/pdf/202603_school_pta_pd_point.pdf
          python <<'PY'
          import fitz
          from pathlib import Path

          document = fitz.open('/tmp/ppc.pdf')
          assert document.page_count == 17, document.page_count
          output = Path('assets/images/ppc-points')
          output.mkdir(parents=True, exist_ok=True)
          pages = {
              1: 'ppc-page-01-cover.png',
              3: 'ppc-page-03-overview.png',
              5: 'ppc-page-05-school-point1.png',
              8: 'ppc-page-08-temporary-note.png',
              11: 'ppc-page-11-consent.png',
              17: 'ppc-page-17-notes.png',
          }
          for number, filename in pages.items():
              pixmap = document[number - 1].get_pixmap(
                  matrix=fitz.Matrix(1.5, 1.5), alpha=False
              )
              path = output / filename
              pixmap.save(path)
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', (filename, data[:8])
              assert len(data) > 20000, (filename, len(data))
              print(filename, len(data), data[:8])
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run all site checks
        run: npm run check:all

      - name: Restore standard workflow and push corrected files
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/site-check.yml <<'YAML'
          name: Site checks

          on:
            pull_request:
            push:
              branches:
                - main

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '20'

                - name: Install dependencies if package metadata is present
                  run: |
                    if [ -f package-lock.json ]; then
                      npm ci
                    elif [ -f package.json ]; then
                      npm install
                    else
                      echo "No package.json found; skipping dependency install."
                    fi

                - name: Run site checks
                  run: npm test
          YAML

          python <<'PY'
          from pathlib import Path
          names = [
              'ppc-page-01-cover.png',
              'ppc-page-03-overview.png',
              'ppc-page-05-school-point1.png',
              'ppc-page-08-temporary-note.png',
              'ppc-page-11-consent.png',
              'ppc-page-17-notes.png',
          ]
          for name in names:
              data = (Path('assets/images/ppc-points') / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
          PY

          git config user.name ptaorg
          git config user.email noreply@ptaorg.com
          git add .github/workflows/site-check.yml assets/images/ppc-points/*.png
          git diff --cached --check
          git commit -m '[skip ci] PPC資料画像を正しいPNGへ置換'
          git push origin HEAD:main
