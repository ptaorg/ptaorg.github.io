name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-guide-board-news-full-20260717
          fetch-depth: 0

      - name: Replace existing newspaper evidence section
        run: python3 scripts/replace-guide-board-principal.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies if package metadata is present
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found; skipping dependency install."
          fi

      - name: Run site checks
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify complete newspaper image in real browsers
        shell: bash
        run: |
          mkdir -p guide-board-news-audit
          python3 -m http.server 4173 > /tmp/guide-board-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/check-guide-board-news-full.js

      - uses: actions/upload-artifact@v4
        with:
          name: guide-board-news-full-audit
          path: guide-board-news-audit

      - name: Commit verified guide page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-board.html
          if git diff --cached --quiet; then
            echo "No guide page change to commit"
          else
            git commit -m "Show full newspaper evidence on education board guide"
            git push origin HEAD:fix-guide-board-news-full-20260717
          fi
