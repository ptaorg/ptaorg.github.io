name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all generated pages, navigation and migration
        run: npm test

  atsugi-draft-pages:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/atsugi-36-school-review-20261116' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate 15 Atsugi source-reviewed schools only
        run: node scripts/generate-atsugi-reviewed-pages.cjs
      - name: Verify only school HTML changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | while read -r file; do
            case "$file" in
              archive/atsugi/*/index.html) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
      - name: Run automated site regression suite
        run: npm test
      - name: Commit draft HTML without deployment
        shell: bash
        run: |
          set -euo pipefail
          git add archive/atsugi/*/index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'draft(atsugi): regenerate 15 reviewed school pages'
          git push origin HEAD:work/atsugi-36-school-review-20261116
