name: Kagoshima archive quick check

on:
  push:
    branches:
      - feat/kagoshima-material-archive

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - name: Show changed generator outputs on failure
        if: failure()
        run: |
          npm run generate:schools
          npm run generate:archive
          npm run enhance:pages
          npm run generate:sitemap
          npm run generate:search
          git --no-pager diff -- archive/kagoshima/school-110-jhs/index.html national-archive.html sitemap.xml data/site-search-index.js | head -135
