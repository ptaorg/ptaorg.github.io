name: one-time-nav-v6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nav-v6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump nav js cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['guide-parent.html','membership.html','privacy.html','fee-collection.html']:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              t=t.replace('/js/current-location-nav.js?v=20260821-5','/js/current-location-nav.js?v=20260821-6')
              p.write_text(t,encoding='utf-8')
          PY
      - name: commit
        run: |
          git config user.name "ptaorg"
          git config user.email "az001530051919@gmail.com"
          git add guide-parent.html membership.html privacy.html fee-collection.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[nav-v6] 現在地ナビJSを更新"
          git push
