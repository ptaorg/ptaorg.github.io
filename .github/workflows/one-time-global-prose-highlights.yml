name: One-time global prose highlights

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-global-prose-highlights.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply highlights
        run: bash scripts/apply-global-prose-highlights.sh
      - name: Commit changes
        run: |
          rm -f .github/workflows/one-time-global-prose-highlights.yml scripts/apply-global-prose-highlights.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add site-wide prose highlights'
          git push
