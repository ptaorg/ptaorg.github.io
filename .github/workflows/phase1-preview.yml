name: Phase 1 visual verification (temporary)
on:
  push:
    branches: [fix/phase1-display-20261113]
permissions:
  contents: write
jobs:
  verify-and-regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render shared chrome and port-aware school pages
        run: |
          node scripts/render-chrome.mjs
          node scripts/phase1-regenerate-school-cards.cjs
      - name: Protect preexisting school text, anchors and public URLs
        run: node tools/phase1-verify-generated.mjs
      - name: Regression tests and whitespace validation
        run: |
          npm test
          git diff --check
      - name: Test desktop and smartphone rendering using Chrome
        run: node tools/phase1-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-screenshots
          path: phase1-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit only verified generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html explore.html municipality.html school.html archive
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate school and shared chrome pages after phase 1 display fix"
            git push origin HEAD:fix/phase1-display-20261113
          fi
