name: One-time integrate PTA school-processing page

on:
  push:
    paths:
      - '.github/workflows/one-time-integrate-pta-school-processing.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix stale copy and site integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. The detail page must follow the site's established site.js cache token.
          p = Path('pta-school-processing.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/js/site.js?v=99', '/js/site.js?v=93')
          p.write_text(s, encoding='utf-8')

          # 2. Remove the old A-E / "成立し得る" wording from the homepage.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '自治体側に成立し得る最も強い適法構成も検討し、A〜Eを「違法度」ではなく、公開・取得資料から確認できた制度的根拠の充足度として評価します。'
          new = '自治体等が示す正当化論を最も有利な形で整理し、公法上の事務根拠、受任権限、教職員の職務、個人情報保護法61条まで同じ順序で検証します。規則や要綱が詳しいこと自体を「良い」「適法」と評価せず、根拠の明文化と上位法との整合性を別軸で示します。'
          assert old in s, 'stale homepage wording not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3. Add this major report to the journal index as the newest entry.
          p = Path('journal.html')
          s = p.read_text(encoding='utf-8')
          if 'href="/pta-school-processing.html"' not in s:
              marker = '<div class="article-list" id="articleList">'
              assert marker in s, 'journal article list not found'
              card = '<a class="article-card article-card--boundary article-card--lead" href="/pta-school-processing.html"><div class="ac-body"><div class="ac-meta"><span class="ac-topic">全国比較</span><span class="ac-date">2026年9月5日</span></div><div class="ac-title">PTA内部事務の学校処理——全国15自治体を同じ審査順序で比較する</div><div class="ac-excerpt">委任・本人同意・学校徴収金規程を根拠に学校がPTA内部事務を処理する制度を、公法上の事務根拠、受任権限、地方公務員法35条、学校教育法37条、個人情報保護法61条・69条の順で検証します。</div></div></a>'
              s = s.replace(marker, marker + '\n' + card, 1)
              s = s.replace('class="article-card article-card--boundary article-card--lead" href="journal/misaki-public-accounting-pta-fee.html"', 'class="article-card article-card--boundary" href="journal/misaki-public-accounting-pta-fee.html"', 1)
          s = s.replace('"dateModified": "2026-09-02"', '"dateModified": "2026-09-05"', 1)
          s = s.replace('data-reviewed="2026-09-02"', 'data-reviewed="2026-09-05"', 1)
          s = s.replace('data-page-revision="journal-20260902-1"', 'data-page-revision="journal-20260905-1"', 1)
          p.write_text(s, encoding='utf-8')

          # 4. The current-location navigator should classify the report as research/journal, not generic.
          p = Path('js/current-location-nav.js')
          s = p.read_text(encoding='utf-8')
          old = "if (path === '/journal.html' || path === '/report.html' || path.indexOf('/journal/') === 0) {"
          new = "if (path === '/journal.html' || path === '/report.html' || path === '/pta-school-processing.html' || path.indexOf('/journal/') === 0) {"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 5. Include the page in the curated research sitemap as well as the generated main sitemap.
          p = Path('sitemap-research.xml')
          s = p.read_text(encoding='utf-8')
          if 'https://ptaorg.com/pta-school-processing.html' not in s:
              entry = '''  <url>\n    <loc>https://ptaorg.com/pta-school-processing.html</loc>\n    <lastmod>2026-09-05</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.9</priority>\n  </url>\n'''
              s = s.replace('</urlset>', entry + '</urlset>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Regenerate search index and sitemap
        shell: bash
        run: |
          npm run generate:search
          npm run generate:sitemap

      - name: Verify integration
        shell: bash
        run: |
          npm run check:site-js-version
          npm run check:site
          python - <<'PY'
          from pathlib import Path
          page = Path('pta-school-processing.html').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          journal = Path('journal.html').read_text(encoding='utf-8')
          search = Path('data/site-search-index.js').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          research = Path('sitemap-research.xml').read_text(encoding='utf-8')
          nav = Path('js/current-location-nav.js').read_text(encoding='utf-8')
          assert '/js/site.js?v=93' in page
          assert '自治体側に成立し得る最も強い適法構成' not in home
          assert 'A〜Eを「違法度」' not in home
          assert 'href="/pta-school-processing.html"' in journal
          assert '/pta-school-processing.html' in search
          assert 'https://ptaorg.com/pta-school-processing.html' in sitemap
          assert 'https://ptaorg.com/pta-school-processing.html' in research
          assert "path === '/pta-school-processing.html'" in nav
          print('PTA school-processing page integration: OK')
          PY

      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-integrate-pta-school-processing.yml
          git add pta-school-processing.html index.html journal.html js/current-location-nav.js sitemap-research.xml sitemap.xml data/site-search-index.js
          git commit -m "Integrate PTA school-processing report across site"
          git push
