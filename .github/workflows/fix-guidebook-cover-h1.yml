name: Fix guidebook cover h1

on:
  workflow_dispatch:
  push:
    branches:
      - fix/guidebook-cover-h1-20260606
    paths:
      - 'tools/fix-guidebook-cover-h1.js'
      - '.github/workflows/fix-guidebook-cover-h1.yml'

permissions:
  contents: write

jobs:
  fix-guidebook-cover-h1:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/guidebook-cover-h1-20260606'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert cover title to h1
        run: node tools/fix-guidebook-cover-h1.js

      - name: Commit guidebook change if needed
        run: |
          if git diff --quiet; then
            echo "No guidebook changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'PTA運営適正化ガイドブック_第4版_改訂本文.html'
          git commit -m "Convert guidebook cover title to h1"
          git push
