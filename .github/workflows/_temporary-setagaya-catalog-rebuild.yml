name: Temporary Setagaya catalog rebuild
on:
  push:
    branches: [article/setagaya-pta-information-separation-20261010]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild in the same order as the generated-file verifier
        run: |
          node scripts/generate-school-pages.js
          node scripts/generate-national-archive.js
          node scripts/enhance-public-pages.js
          node scripts/generate-sitemap.js
          node scripts/generate-search-index.js
      - name: Commit only the two generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml data/site-search-index.js
          if ! git diff --staged --quiet; then
            git commit -m "Align indexes with canonical generated-site pipeline"
            git push origin HEAD:article/setagaya-pta-information-separation-20261010
          fi
