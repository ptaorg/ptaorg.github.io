name: One-time optin css version
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-optin-css-version.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump optin css version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pta-membership-optin.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/css/optin.css?v=20260814-2', '/css/optin.css?v=20260905-1')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: grep -q '/css/optin.css?v=20260905-1' pta-membership-optin.html
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/one-time-optin-css-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pta-membership-optin.html
          git add -u
          git commit -m 'Refresh opt-in stylesheet version' || exit 0
          git push
