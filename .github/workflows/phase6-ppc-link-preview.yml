name: Phase 6 verified PPC link repair (temporary)
on:
  push:
    branches: [fix/phase6-ppc-official-link-20261113]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm unchanged primary evidence and original prose
        run: |
          npm test
          node tools/phase6-ppc-link-verify.mjs
          git diff --check
      - name: Check source hyperlink at desktop and smartphone widths
        run: node tools/phase6ppc-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-ppc-link-screenshots
          path: phase6ppc-screenshots/*.png
          if-no-files-found: ignore
