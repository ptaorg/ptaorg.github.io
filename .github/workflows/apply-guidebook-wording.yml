name: Apply guidebook wording

on:
  workflow_dispatch:
  push:
    branches:
      - fix/guidebook-public-private-wording-20260606
    paths:
      - '.github/workflows/apply-guidebook-wording.yml'
      - 'tools/fix-guidebook-wording.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/guidebook-public-private-wording-20260606'
    steps:
      - uses: actions/checkout@v4
      - run: node tools/fix-guidebook-wording.js
      - run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'PTA運営適正化ガイドブック_第4版_改訂本文.html'
          git commit -m "Adjust guidebook wording"
          git pull --rebase
          git push
