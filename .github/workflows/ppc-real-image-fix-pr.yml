name: Run PPC real-image fix from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare repair script with freshly rendered PNG source pages
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prepare_ppc_repair.py <<'PY'
          from pathlib import Path

          path = Path('scripts/ppc-real-image-fix.sh')
          text = path.read_text(encoding='utf-8')

          render = r'''
          python -m pip install --quiet PyMuPDF
          curl --fail --location --retry 3 --output /tmp/ppc-source.pdf \
            https://www.ppc.go.jp/files/pdf/202603_school_pta_pd_point.pdf
          python <<'PYPDF'
          import fitz
          from pathlib import Path

          document = fitz.open('/tmp/ppc-source.pdf')
          assert document.page_count == 17, document.page_count
          output = Path('assets/images/ppc-points')
          output.mkdir(parents=True, exist_ok=True)
          pages = {
              1: 'ppc-page-01-cover.png',
              3: 'ppc-page-03-overview.png',
              5: 'ppc-page-05-school-point1.png',
              8: 'ppc-page-08-temporary-note.png',
              11: 'ppc-page-11-consent.png',
              17: 'ppc-page-17-notes.png',
          }
          for number, filename in pages.items():
              pixmap = document[number - 1].get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False)
              target = output / filename
              pixmap.save(target)
              data = target.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', (filename, data[:8])
              assert len(data) > 20000, (filename, len(data))
              print(filename, pixmap.width, pixmap.height, len(data))
          PYPDF
          rm -f assets/images/ppc-points/*.jpg
          '''

          text = text.replace('set -euo pipefail\n\nimages=(', 'set -euo pipefail\n' + render + '\nimages=(', 1)
          text = text.replace('.jpg', '.png')
          text = text.replace('rm -f assets/images/ppc-points/*.png', 'rm -f assets/images/ppc-points/*.jpg', 1)
          text = text.replace('xxd -p -l 3', 'xxd -p -l 8')
          text = text.replace('"ffd8ff"', '"89504e470d0a1a0a"')
          text = text.replace("!x.contentType.startsWith('image/jpeg')", "!x.contentType.startsWith('image/png')")
          text = text.replace(
              "await p.goto('http://127.0.0.1:4173/ppc-points.html',{waitUntil:'networkidle'});const r=",
              "await p.goto('http://127.0.0.1:4173/ppc-points.html',{waitUntil:'networkidle'});for(const img of await p.locator('.ppc-source-figure img').all()){await img.scrollIntoViewIfNeeded();await img.evaluate(el=>el.decode?el.decode().catch(()=>{}):Promise.resolve())}await p.evaluate(()=>scrollTo(0,0));const r="
          )
          text = text.replace(
              "await p.goto(`https://ptaorg.com/ppc-points.html?verify=${commit}&attempt=${a}`,{waitUntil:'networkidle',timeout:60000});const r=",
              "await p.goto(`https://ptaorg.com/ppc-points.html?verify=${commit}&attempt=${a}`,{waitUntil:'networkidle',timeout:60000});for(const img of await p.locator('.ppc-source-figure img').all()){await img.scrollIntoViewIfNeeded();await img.evaluate(el=>el.decode?el.decode().catch(()=>{}):Promise.resolve())}await p.evaluate(()=>scrollTo(0,0));const r="
          )
          text = text.replace(
              'npm ci\nnpm run check:all',
              'npm ci\nnpm run generate:sitemap\nnpm run generate:search\ngit add sitemap.xml data/site-search-index.js\nnpm run check:all'
          )
          text = text.replace(
              'git add ppc-points.html css/prose.css css/pages/ppc-points.css ',
              'git add ppc-points.html css/prose.css css/pages/ppc-points.css sitemap.xml data/site-search-index.js assets/images/ppc-points '
          )
          path.write_text(text, encoding='utf-8')
          PY
          python /tmp/prepare_ppc_repair.py

      - name: Run validated repair
        shell: bash
        run: bash scripts/ppc-real-image-fix.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppc-real-image-fix-evidence
          path: |
            /tmp/ppc-local-report.json
            /tmp/ppc-public-report.json
            /tmp/ppc-final-commit.txt
            /tmp/ppc-local-desktop-top.png
            /tmp/ppc-local-desktop-middle.png
            /tmp/ppc-local-desktop-bottom.png
            /tmp/ppc-local-mobile-top.png
            /tmp/ppc-local-mobile-middle.png
            /tmp/ppc-public-desktop-top.png
            /tmp/ppc-public-desktop-middle.png
            /tmp/ppc-public-desktop-bottom.png
            /tmp/ppc-public-mobile-top.png
            /tmp/ppc-public-mobile-middle.png
          if-no-files-found: warn
          retention-days: 7
