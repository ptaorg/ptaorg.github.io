name: Run PPC real-image fix from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Adjust repair script for source dimensions and generated files
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/-gt 20000/-gt 1000/' scripts/ppc-real-image-fix.sh
          sed -i 's/naturalHeight<500/naturalHeight<300/g' scripts/ppc-real-image-fix.sh
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/ppc-real-image-fix.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'npm ci\nnpm run check:all',
              'npm ci\nnpm run generate:sitemap\nnpm run generate:search\nnpm run check:all'
          )
          text = text.replace(
              'git add ppc-points.html css/prose.css css/pages/ppc-points.css ',
              'git add ppc-points.html css/prose.css css/pages/ppc-points.css sitemap.xml data/site-search-index.js '
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run validated repair
        shell: bash
        run: bash scripts/ppc-real-image-fix.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppc-real-image-fix-evidence
          path: |
            /tmp/ppc-local-report.json
            /tmp/ppc-public-report.json
            /tmp/ppc-final-commit.txt
            /tmp/ppc-local-desktop-top.png
            /tmp/ppc-local-desktop-middle.png
            /tmp/ppc-local-desktop-bottom.png
            /tmp/ppc-local-mobile-top.png
            /tmp/ppc-local-mobile-middle.png
            /tmp/ppc-public-desktop-top.png
            /tmp/ppc-public-desktop-middle.png
            /tmp/ppc-public-desktop-bottom.png
            /tmp/ppc-public-mobile-top.png
            /tmp/ppc-public-mobile-middle.png
          if-no-files-found: warn
          retention-days: 7
