name: Swap card images to classroom

on:
  workflow_dispatch:
  push:
    branches:
      - fix/use-classroom-image-cards-20260606
    paths:
      - '.github/workflows/swap-card-images-to-classroom.yml'
      - 'tools/swap-card-images-to-classroom.js'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/use-classroom-image-cards-20260606'
    steps:
      - uses: actions/checkout@v4
      - run: node tools/swap-card-images-to-classroom.js
      - run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html audit/index.html
          git commit -m "Use classroom image on selected cards"
          git pull --rebase
          git push
