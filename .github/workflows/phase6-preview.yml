name: Phase 6A official source references QA (temporary)
on:
  push:
    branches: [research/phase6-official-sources-20261113]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate inline source notes and per-article official reference lists
        run: node scripts/phase6-link-sources.cjs
      - name: Exact quotation and URL preservation plus repository checks
        run: |
          npm test
          node scripts/phase6-link-sources.cjs --check
          node tools/phase6-source-verify.mjs
          git diff --check
      - name: Chromium desktop and mobile source-footnote verification
        run: node tools/phase6-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-source-screenshots
          path: phase6-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit only citation notes to the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Add official source footnotes and article source lists without changing text"
            git push origin HEAD:research/phase6-official-sources-20261113
          fi
