name: One-time outline PPC red heading

on:
  push:
    paths:
      - 'scripts/legacy/one-time-outline-ppc-red-heading.py'
      - '.github/workflows/one-time-outline-ppc-red-heading.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PPC heading outline
        run: python3 scripts/legacy/one-time-outline-ppc-red-heading.py
      - name: Verify PPC heading outline
        run: |
          grep -q -- '-webkit-text-stroke: 0.8px #fff;' css/pages/ppc-points.css
          grep -q 'ppc-points.css?v=20260906-1' ppc-points.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/pages/ppc-points.css ppc-points.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Improve PPC red heading contrast'
            git push
          fi
