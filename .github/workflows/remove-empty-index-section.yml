name: Remove empty index section

on:
  workflow_dispatch:
  push:
    branches:
      - fix/index-empty-section-20260606
    paths:
      - 'tools/remove-empty-index-section.js'
      - '.github/workflows/remove-empty-index-section.yml'

permissions:
  contents: write

jobs:
  remove-empty-section:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/index-empty-section-20260606'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove empty entry section
        run: node tools/remove-empty-index-section.js

      - name: Commit index change if needed
        run: |
          if git diff --quiet; then
            echo "No index.html changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove empty entry section from index"
          git push
