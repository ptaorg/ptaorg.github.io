name: Revert extra card images

on:
  workflow_dispatch:
  push:
    branches:
      - fix/revert-extra-card-images-20260606
    paths:
      - '.github/workflows/revert-extra-card-images.yml'
      - 'tools/revert-extra-card-images.js'

permissions:
  contents: write

jobs:
  revert-extra:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/revert-extra-card-images-20260606'
    steps:
      - uses: actions/checkout@v4
      - run: node tools/revert-extra-card-images.js
      - run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html audit/index.html
          git commit -m "Revert extra card image changes"
          git pull --rebase
          git push
