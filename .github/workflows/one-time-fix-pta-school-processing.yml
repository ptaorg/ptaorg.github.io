name: One-time fix PTA school-processing page

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-pta-school-processing.yml'

permissions:
  contents: write

jobs:
  fix-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Standardize page shell and responsive layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pta-school-processing.html')
          s = path.read_text(encoding='utf-8')

          standard_header = '''<div class="support-strip" role="complementary" aria-label="活動支援のお願い"><div class="support-strip-inner"><span class="support-strip-label">応援のお願い</span><span class="support-strip-text">資料取得、資料整理、Web公開を続けるため、寄付・カンパでのご支援をお願いします。</span><a class="support-strip-link" href="/support.html">応援ページへ</a></div></div>
          <header class="site-header"><div class="nav-container"><a class="logo" href="/index.html"><img alt="PTA適正化推進委員会" src="/assets/popc-logo.png"><span>PTA適正化推進委員会</span></a><div class="header-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg><input aria-label="サイト内検索" class="search-input" placeholder="キーワードで検索…" type="text"><div class="search-results-dropdown"></div></div><nav aria-label="主要ナビゲーション" class="desktop-nav"><a class="nav-link" href="/index.html">トップ</a><a class="nav-link" href="/pta-membership-optin.html">オプトイン</a><a class="nav-link" href="/ppc-points.html">PPC資料</a><a class="nav-link nav-link-priority" href="/board-responses.html" aria-label="教育委員会の回答">教育委員会回答</a><div class="nav-item has-dropdown"><a class="nav-link" href="/law-map.html" aria-haspopup="true">論点別</a><div class="mega-menu" aria-label="論点別メニュー"><div class="mega-col"><h4>加入・情報</h4><ul><li><a class="mega-link" href="/law-map.html"><strong>法制度マップ</strong><span>論点と関連法令を一覧で確認</span></a></li><li><a class="mega-link" href="/membership.html"><strong>入会と申込記録</strong><span>任意加入と意思確認の成立要件</span></a></li><li><a class="mega-link" href="/privacy.html"><strong>個人情報</strong><span>学校保有情報とPTA利用の境界</span></a></li></ul></div><div class="mega-col"><h4>学校との境界</h4><ul><li><a class="mega-link" href="/fee-collection.html"><strong>会費徴収</strong><span>学校徴収金との分離を確認</span></a></li><li><a class="mega-link" href="/personnel.html"><strong>教職員関与</strong><span>勤務時間・職務専念義務を整理</span></a></li><li><a class="mega-link" href="/facilities.html"><strong>施設利用</strong><span>学校施設の目的外使用を確認</span></a></li><li><a class="mega-link" href="/education-board-responsibility.html"><strong>教育委員会の所掌</strong><span>学校関与を点検すべき理由</span></a></li></ul></div></div></div><div class="nav-item has-dropdown"><a class="nav-link" href="/documents.html" aria-haspopup="true">根拠資料</a><div class="mega-menu" aria-label="根拠資料メニュー"><div class="mega-col"><h4>一次資料</h4><ul><li><a class="mega-link" href="/board-responses.html"><strong>教育委員会の回答</strong><span>自治体別・論点別の公式回答</span></a></li><li><a class="mega-link" href="/national-archive.html"><strong>全国資料館</strong><span>自治体・学校の実物文書</span></a></li><li><a class="mega-link" href="/administrative-materials.html"><strong>行政通知・公式PDF</strong><span>行政機関の通知と公開資料</span></a></li></ul></div><div class="mega-col"><h4>分析・検証</h4><ul><li><a class="mega-link" href="/journal.html"><strong>論考・調査報告</strong><span>個別テーマを本文で読む</span></a></li><li><a class="mega-link" href="/report.html"><strong>総合分析レポート</strong><span>問題構造を俯瞰して確認</span></a></li><li><a class="mega-link" href="/cases.html"><strong>判例整理</strong><span>関連裁判例の争点を確認</span></a></li><li><a class="mega-link" href="/claim-evidence-ledger.html"><strong>主張と根拠の対応表</strong><span>条文・資料・文例を照合</span></a></li></ul></div></div></div><div class="nav-item has-dropdown"><a class="nav-link" href="/index.html#audience-gateway" aria-haspopup="true">立場別</a><div class="mega-menu" aria-label="立場別メニュー"><div class="mega-col"><h4>読む人から選ぶ</h4><ul><li><a class="mega-link" href="/guide-parent.html"><strong>保護者の方へ</strong><span>入会・会費・情報の確認手順</span></a></li><li><a class="mega-link" href="/guide-pta.html"><strong>PTA役員の方へ</strong><span>運営を適正化する実務手順</span></a></li></ul></div><div class="mega-col"><h4>実務・調査</h4><ul><li><a class="mega-link" href="/guide-board.html"><strong>教育委員会・学校へ</strong><span>学校関与と初動チェック</span></a></li><li><a class="mega-link" href="/guide-research.html"><strong>研究者・記者の方へ</strong><span>一次資料と調査導線</span></a></li></ul></div></div></div></nav><button class="hamburger" id="hamburger" aria-controls="mobileOverlay" aria-expanded="false" aria-label="メニューを開く"><span></span><span></span><span></span></button></div></header>
          <div class="mobile-overlay" id="mobileOverlay"><div class="mobile-menu-group"><div class="mobile-menu-label">最重要</div><a class="mobile-link" href="/index.html">トップ</a><a class="mobile-link" href="/pta-membership-optin.html">オプトインの原則</a><a class="mobile-link" href="/ppc-points.html">PPC資料の読み方</a><a class="mobile-link mobile-link-priority" href="/board-responses.html">教育委員会の回答</a></div><div class="mobile-menu-group"><div class="mobile-menu-label">論点別</div><a class="mobile-link" href="/law-map.html">法制度マップ</a><a class="mobile-link" href="/membership.html">加入と申込記録</a><a class="mobile-link" href="/privacy.html">個人情報</a><a class="mobile-link" href="/fee-collection.html">会費徴収</a><a class="mobile-link" href="/personnel.html">教職員関与</a><a class="mobile-link" href="/facilities.html">施設利用</a><a class="mobile-link" href="/education-board-responsibility.html">教育委員会の所掌</a></div><div class="mobile-menu-group"><div class="mobile-menu-label">根拠資料</div><a class="mobile-link" href="/national-archive.html">全国資料館</a><a class="mobile-link" href="/journal.html">論考・調査報告</a><a class="mobile-link" href="/administrative-materials.html">行政通知・公式PDF</a><a class="mobile-link" href="/report.html">総合分析レポート</a><a class="mobile-link" href="/cases.html">判例整理</a></div><div class="mobile-menu-group"><div class="mobile-menu-label">立場別</div><a class="mobile-link" href="/guide-parent.html">保護者の方へ</a><a class="mobile-link" href="/guide-pta.html">PTA役員の方へ</a><a class="mobile-link" href="/guide-board.html">教育委員会・学校へ</a><a class="mobile-link" href="/guide-research.html">研究者・記者の方へ</a></div><button type="button" class="mobile-close-btn" id="closeOverlay" aria-label="メニューを閉じる">閉じる ×</button></div>'''

          standard_footer = '''<footer class="footer"><div class="footer-inner"><div class="footer-grid"><div><h3>PTA適正化推進委員会</h3><a class="yokomusubi-card" href="https://yokomusubi.city.yokohama.lg.jp/organizations/detail/f69c7ad2-cf21-4dfa-87bb-9c891874eb6b/" rel="noopener noreferrer" target="_blank"><img alt="よこむすび" src="/assets/yokomusubi.png"><span class="yokomusubi-tagline">磯子区「よこむすび」掲載団体</span></a><div class="footer-contact"><p>〒235-0021<br>神奈川県横浜市磯子区岡村8-17-5-301</p><p><strong>070-9012-7772</strong></p><p><a href="mailto:info@ptaorg.com">info@ptaorg.com</a></p></div></div><div><h4>公式発信</h4><p class="footer-sns-sub">最新資料・論考・動画はこちら</p><div class="footer-sns-cards"><a class="fsns-card fsns-x" href="https://x.com/jjjqqqxxx0852" rel="noopener" target="_blank"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.736-8.836L2.25 2.25H8.08l4.263 5.636L18.244 2.25Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"></path></svg><div><div class="fsns-name">X</div><div class="fsns-desc">速報・資料更新</div></div></a><a class="fsns-card fsns-yt" href="https://www.youtube.com/@PTA%E9%81%A9%E6%AD%A3%E5%8C%96%E6%8E%A8%E9%80%B2%E5%A7%94%E5%93%A1%E4%BC%9A" rel="noopener" target="_blank"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg><div><div class="fsns-name">YouTube</div><div class="fsns-desc">動画で解説</div></div></a><a class="fsns-card fsns-note" href="https://note.com/hiroshisatoh" rel="noopener" target="_blank"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 3h18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v14h14V5H4zm2 3h10v2H6V8zm0 4h10v2H6v-2zm0 4h6v2H6v-2z"></path></svg><div><div class="fsns-name">note</div><div class="fsns-desc">論考・研究ノート</div></div></a></div></div><div><h4>立場別</h4><ul><li><a href="/guide-parent.html">保護者</a></li><li><a href="/guide-pta.html">PTA役員</a></li><li><a href="/guide-board.html">教育委員会・学校</a></li><li><a href="/guide-research.html">研究者・記者</a></li></ul></div><div><h4>論点</h4><ul><li><a href="/membership.html">入会手続</a></li><li><a href="/privacy.html">個人情報</a></li><li><a href="/fee-collection.html">会費徴収</a></li><li><a href="/personnel.html">教職員関与</a></li><li><a href="/facilities.html">施設利用</a></li></ul></div><div><h4>資料・支援</h4><ul><li><a href="/support.html">応援・寄付</a></li><li><a href="/board-responses.html">教育委員会の回答</a></li><li><a href="/national-archive.html">全国資料館</a></li><li><a href="/journal.html">論考・調査報告</a></li><li><a href="/report.html">総合分析レポート</a></li><li><a href="/audit/index.html">運営チェック</a></li><li><a href="/law-map.html">法制度マップ</a></li><li><a href="/guideline.html">適正化ガイドライン</a></li></ul></div></div></div><div class="footer-support"><div><strong>調査・資料公開の継続を応援してください</strong><p>いただいたご支援は、資料取得、資料整理、Web公開、自治体・学校への働きかけに活用します。</p></div><a href="/support.html">応援ページへ</a></div><p class="copyright">© PTA適正化推進委員会</p></footer>'''

          # Standard header/footer.
          s, n = re.subn(r'<header class="psc-header">.*?</header>', standard_header, s, count=1, flags=re.S)
          assert n == 1, 'custom header not found'
          s, n = re.subn(r'<footer class="psc-footer">.*?</footer>', standard_footer, s, count=1, flags=re.S)
          assert n == 1, 'custom footer not found'

          # Standard site integration and cache busting.
          s = re.sub(r'<body([^>]*)>', lambda m: '<body' + re.sub(r'\s+class="[^"]*"', '', m.group(1)) + ' class="pta-school-processing-editorial">', s, count=1)
          s = s.replace('<main class="psc-page">', '<main class="psc-page" id="main-content">', 1)
          s = re.sub(r'/css/prose\.css\?v=[^"\']+', '/css/prose.css?v=20260905-2', s)
          s = re.sub(r'/js/site\.js\?v=[^"\']+', '/js/site.js?v=99', s)

          # Complete standard metadata used elsewhere on the site.
          if 'fonts.googleapis.com/css2?family=Noto+Sans+JP' not in s:
              fonts = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">'
              s = s.replace('</title>', '</title>' + fonts, 1)
          if 'favicon-192.png' not in s:
              s = s.replace('<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">', '<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/assets/favicon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">', 1)
          if 'href="/llms.txt"' not in s:
              s = s.replace('</head>', '<link rel="alternate" type="text/plain" href="/llms.txt" title="AI向けサイト案内"></head>', 1)

          # Wider document canvas; make the seven-column comparison table readable.
          s = s.replace('.psc-page{max-width:1080px;margin:0 auto;background:var(--psc-paper);box-shadow:0 0 0 1px rgba(25,35,45,.04);padding:58px 70px 80px}', '.psc-page{max-width:1180px;margin:0 auto;background:var(--psc-paper);box-shadow:0 0 0 1px rgba(25,35,45,.04);padding:54px 48px 80px}')
          s = s.replace('.psc-table th:nth-child(1),.psc-table td:nth-child(1){width:7%}.psc-table th:nth-child(2),.psc-table td:nth-child(2){width:14%}.psc-table th:nth-child(3),.psc-table td:nth-child(3){width:17%}.psc-table th:nth-child(4),.psc-table td:nth-child(4){width:22%}.psc-table th:nth-child(5),.psc-table td:nth-child(5){width:21%}.psc-table th:nth-child(6),.psc-table td:nth-child(6){width:12%;text-align:left}.psc-table th:nth-child(7),.psc-table td:nth-child(7){width:7%}', '.psc-table th:nth-child(1),.psc-table td:nth-child(1){width:7%}.psc-table th:nth-child(2),.psc-table td:nth-child(2){width:13%}.psc-table th:nth-child(3),.psc-table td:nth-child(3){width:16%}.psc-table th:nth-child(4),.psc-table td:nth-child(4){width:21%}.psc-table th:nth-child(5),.psc-table td:nth-child(5){width:21%}.psc-table th:nth-child(6),.psc-table td:nth-child(6){width:13%;text-align:left}.psc-table th:nth-child(7),.psc-table td:nth-child(7){width:9%}')
          s = s.replace('.psc-table .source{white-space:normal;word-break:keep-all}', '.psc-table .source{white-space:normal;word-break:normal;overflow-wrap:anywhere}')

          # Explicit mobile table hint and accessible caption.
          if 'psc-table-caption' not in s:
              s = s.replace('<table class="psc-table">', '<table class="psc-table"><caption class="psc-table-caption">優先15自治体・都道府県の学校処理制度比較（根拠の明文化と法的整合性は別軸）</caption>', 1)
          if 'psc-scroll-note' not in s:
              s = s.replace('<div class="psc-table-wrap">', '<p class="psc-scroll-note">※ 画面幅が狭い場合は、表を左右にスクロールできます。</p><div class="psc-table-wrap">', 1)

          # Page-local overrides: keep per-municipality charts compact and neutral.
          overrides = '''
          .psc-table-caption{caption-side:top;text-align:left;padding:0 0 10px;font-weight:800;color:#33424d}.psc-scroll-note{display:none;margin:0 0 8px!important;font-size:.78rem;color:#66737c}
          .psc-case-viz-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important;border-top:0!important}.psc-case-viz-step{margin:0!important;padding:11px 10px!important;border:1px solid #cfd7de!important;background:#fff!important}.psc-case-viz-step:after{display:none!important}.psc-case-viz{margin:14px 26px 24px!important;padding:16px 18px!important;border-top:1px solid #cfd7de!important;border-bottom:1px solid #cfd7de!important;background:#fafbfb!important}
          @media(max-width:980px){.psc-scroll-note{display:block}.psc-page{padding-left:30px;padding-right:30px}}@media(max-width:760px){.psc-page{padding:34px 18px 58px}.psc-case-viz-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.psc-case-viz{margin-left:18px!important;margin-right:18px!important;padding-left:12px!important;padding-right:12px!important}}
          '''
          if 'psc-table-caption{caption-side:top' not in s:
              s = s.replace('</style>', overrides + '</style>', 1)

          # Basic structural assertions.
          assert s.count('class="site-header"') == 1
          assert s.count('id="mobileOverlay"') == 1
          assert s.count('<footer class="footer">') == 1
          assert 'class="psc-header"' not in s
          assert 'class="psc-footer"' not in s
          assert s.count('class="psc-audit-case"') == 5
          assert s.count('<tr><td>') >= 15
          assert '/js/site.js?v=99' in s
          assert '/css/prose.css?v=20260905-2' in s

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify resulting HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('pta-school-processing.html').read_text(encoding='utf-8')
          checks = {
            'standard header': '<header class="site-header">' in s,
            'mobile navigation': 'id="mobileOverlay"' in s,
            'standard footer': '<footer class="footer">' in s,
            'comparison table': '<table class="psc-table">' in s,
            'five detailed cases': s.count('class="psc-audit-case"') == 5,
            'current JS': '/js/site.js?v=99' in s,
            'current prose CSS': '/css/prose.css?v=20260905-2' in s,
          }
          for k, v in checks.items():
              print(k, 'OK' if v else 'FAIL')
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Commit page fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-pta-school-processing.yml
          git add pta-school-processing.html
          git commit -m "Standardize PTA school-processing page shell"
          git push
