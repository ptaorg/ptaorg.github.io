name: Phase 4D decorative SVG icon audit (temporary)
on:
  push:
    branches: [refactor/phase4d-semantic-icons-20261113]
permissions:
  contents: write
jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Convert safe icon-only glyphs without touching research prose
        run: node scripts/phase4d-icons.cjs
      - name: Check reproducibility, quotes, source URLs and anchor IDs
        run: |
          npm test
          node scripts/phase4d-icons.cjs --check
          node tools/phase4d-verify.mjs
          git diff --check
      - name: Render pictograms at both screen widths
        run: node tools/phase4d-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4d-icon-screenshots
          path: phase4d-screenshots/*.png
          if-no-files-found: ignore
      - name: Commit only verified guide HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-board.html guide-pta.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace 65 decorative check/cross glyphs with accessible SVG"
            git push origin HEAD:refactor/phase4d-semantic-icons-20261113
          fi
