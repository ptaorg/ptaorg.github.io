name: Temporary Setagaya primary-source capture
on:
  push:
    branches:
      - article/setagaya-pta-information-separation-20261010
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare PDF renderer
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Capture original public document pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/setagaya-pta-separation
          capture() {
            local name="$1" url="$2" page="$3"
            local pdf="/tmp/${name}.pdf"
            local out="assets/images/setagaya-pta-separation/${name}"
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 90 "$url" -o "$pdf" && pdfinfo "$pdf" >/dev/null 2>&1; then
              local pages
              pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
              if [ "$page" -le "$pages" ]; then
                pdftoppm -f "$page" -l "$page" -scale-to 1600 -png -singlefile "$pdf" "$out"
                echo "CAPTURED ${out}.png from ${url} page ${page}"
              else
                echo "NOT CAPTURED ${name}: page ${page} > ${pages}"
              fi
            else
              echo "NOT CAPTURED ${name}: inaccessible PDF"
            fi
          }
          capture "setagaya-20251209-p3" "https://www.city.setagaya.lg.jp/documents/30377/3-7.pdf" 3
          capture "setagaya-pta-guide-202604-p6" "https://www.city.setagaya.lg.jp/documents/1984/r8-minnnademanabupta.pdf" 6
          capture "roka-jhs-pta-20251011-p1" "https://school.setagaya.ed.jp/troka/download/document/18248741?tm=20260307163719" 1
          capture "matsuzawa-pta-membership-2026-p1" "https://matsuzawashopta.jp/wp-content/uploads/2026/04/PTA_new_2026_01_Form.pdf" 1
          capture "matsuzawa-pta-payment-2026-p1" "https://matsuzawashopta.jp/wp-content/uploads/2026/04/PTA_new_2026_02_Fee.pdf" 1
      - name: Regenerate machine indexes
        run: |
          node scripts/generate-sitemap.js
          node scripts/generate-search-index.js
      - name: Commit original captures and generated indexes to article branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/setagaya-pta-separation/ sitemap.xml data/site-search-index.js
          if ! git diff --staged --quiet; then
            git commit -m "Capture primary-source PDF pages and regenerate site indexes"
            git push origin HEAD:article/setagaya-pta-information-separation-20261010
          fi
