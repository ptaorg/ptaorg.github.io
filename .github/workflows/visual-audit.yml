name: Full-site visual audit

on:
  pull_request:
    branches:
      - main

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pta-visual-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/index.html >/dev/null

      - name: Run structural checks
        continue-on-error: true
        run: npm test

      - name: Run Chromium full-site audit
        run: node tools/visual-audit.mjs

      - name: Create contact sheets
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('visual-audit-output')
          for mode in ('desktop','mobile'):
              files=sorted((root/mode).glob('*.jpg'))
              thumbs=[]
              for f in files:
                  im=Image.open(f).convert('RGB')
                  top=im.crop((0,0,im.width,min(im.height,1800)))
                  top.thumbnail((260,300))
                  canvas=Image.new('RGB',(280,340),'white')
                  canvas.paste(top,((280-top.width)//2,8))
                  ImageDraw.Draw(canvas).text((10,316),f.stem.replace('__','/')[:44],fill='black')
                  thumbs.append(canvas)
              cols=4
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*280,rows*340),(235,238,242))
              for i,t in enumerate(thumbs):
                  sheet.paste(t,((i%cols)*280,(i//cols)*340))
              sheet.save(root/f'contact-sheet-{mode}.jpg',quality=82)
          PY

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pta-full-site-visual-audit
          path: visual-audit-output/
          retention-days: 7
