# GitHub Pages build settings
# Public HTML/CSS/JS assets remain available. Internal notes, scripts, and work files are excluded from the published site.
exclude:
  - docs/
  - source-candidates/
  - scripts/
  - tests/
  - tools/
  - ai-system/
  - node_modules/
  - package-lock.json
  - package.json
  - README.md
  - AGENTS.md
  - SITE_STRUCTURE.md
  - URL_LEDGER.md
  - コミット手順.md
  - コミット手順.html
  - starter-kit/*.md
  - starter-kit/implementation/
  - starter-kit/source/
  - starter-kit/downloads/
  - starter-kit/forms/
  - starter-kit/pdf/
  - starter-kit/templates/
  - starter-kit/html/
  - assets/compliance/README.md
  - shorts/
  - parts/
  - .claude/
  - .github/
  - .visual-audit-request-20260711/
  - deploy-pages.yml
  - one-time-admin-materials-pr.yml
  - simplify-compliance-copy.yml
  - pta-open-system/

# Jekyll also renders the kit's preserved Markdown into companion HTML.
# Supply discovery metadata only within this versioned artifact area.
defaults:
  - scope:
      path: assets/kit
    values:
      description: PTA実務移行キットの基準版に付属する要確認事項・制作計画の記録です。法理・根拠の共通正本はMaster v0.3.1です。
