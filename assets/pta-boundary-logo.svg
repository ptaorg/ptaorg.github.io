<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">学校とPTAは別主体</title>
  <desc id="desc">左に学校、右にPTAを配置し、中央の記号で両者が別主体であることを示す図</desc>

  <rect width="320" height="320" fill="#ffffff"/>

  <!-- 学校 -->
  <g aria-label="学校" transform="translate(32 58)">
    <path d="M18 74L70 34l52 40" fill="none" stroke="#1f5f8b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="76" width="84" height="82" rx="6" fill="#eaf3f8" stroke="#1f5f8b" stroke-width="8"/>
    <rect x="62" y="111" width="18" height="47" rx="2" fill="#1f5f8b"/>
    <rect x="43" y="91" width="14" height="14" rx="2" fill="#1f5f8b"/>
    <rect x="83" y="91" width="14" height="14" rx="2" fill="#1f5f8b"/>
    <circle cx="70" cy="60" r="10" fill="#ffffff" stroke="#1f5f8b" stroke-width="5"/>
    <path d="M70 54v7l5 3" fill="none" stroke="#1f5f8b" stroke-width="3.5" stroke-linecap="round"/>
    <text x="70" y="198" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="28" font-weight="800" fill="#163f5d">学校</text>
  </g>

  <!-- 境界 -->
  <g aria-hidden="true">
    <path d="M160 55v210" stroke="#d4af37" stroke-width="5" stroke-dasharray="7 9" stroke-linecap="round"/>
    <circle cx="160" cy="156" r="27" fill="#102b49" stroke="#f5d56c" stroke-width="5"/>
    <text x="160" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">≠</text>
  </g>

  <!-- PTA -->
  <g aria-label="PTA" transform="translate(183 66)">
    <circle cx="51" cy="56" r="20" fill="#e4572e"/>
    <circle cx="24" cy="74" r="15" fill="#0f766e"/>
    <circle cx="79" cy="74" r="15" fill="#0f766e"/>
    <path d="M24 94c-14 0-24 12-24 28v30h47v-30c0-16-10-28-23-28z" fill="#0f766e"/>
    <path d="M79 94c-14 0-24 12-24 28v30h48v-30c0-16-10-28-24-28z" fill="#0f766e"/>
    <path d="M51 82c-17 0-30 15-30 34v48h60v-48c0-19-13-34-30-34z" fill="#e4572e"/>
    <text x="51" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="2" fill="#8b3e20">PTA</text>
  </g>
</svg>
