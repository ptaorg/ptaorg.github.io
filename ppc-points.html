   "acceptedAnswer": {
    "@type": "Answer",
    "text": "PTA加入の申込みと会費の支払いは別の意思表示です。学校徴収金にPTA会費を混ぜて引き落とす「抱き合わせ徴収」は、任意性や加入意思が確認できなくなるため、加入・情報提供・支払いを分けて確認する必要があります。"

   "acceptedAnswer": {
    "@type": "Answer",
